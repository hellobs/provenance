# GTC Case 01 · Run 只读数据服务 —— 机器可读契约(OpenAPI 3.1)
#
# 本文件只覆盖【平台对接端点】;/api/runs、/api/runs/{run_id}、
# /api/runs/{run_id}/full-context、/api/expert-categories 是平台侧的正式对接面。
#
# 2026-10-05 补入**共享历史面**的三条(与 case01/case00 哪个在跑无关,由
# `live/history.py` 的 router 提供,真实 5010 服务在 `live/routes.py` 挂载):
#   /api/review-package/{run_id}      —— 平台建单用只读交接包
#   /api/run-detail/{source}/{run_id} —— 共享只读详情(专家安全视图)
#   /embed/explore                    —— 数据界面(HTML,供平台嵌入)
# 此前契约只列 case01 serve.app 的路由,这三条被**静默遗漏**;守卫的比对域
# 已从 `serve.app.routes` 扩到与 `live.history.router` 的并集(见 test_serve.py),
# 以后少写一条就是红。
# 不含 /viewer:它是实现侧调试挂载(serve.app.mount("/viewer", StaticFiles),
# 依赖 gitignored 的 runs_html/ 目录,且 FastAPI 自身的 /openapi.json 也不含它,
# 不是 API 操作端点、不是平台对接面)。详见 prose 契约 Governance平台对接说明.md §1.1。
#
# 顶层键读/写约定(对应 run.json;页面 prose 契约 §2.2):
#   平台要读:run_id / 日期 / turns / retrievals / events / state_history /
#            final_feedback / audit / condition_monitor / reflection / router。
#   实现侧附加键、平台不读:summary / injector / compat / quality / debug。
#            其中 injector 含 Branch 实验元信息与逐节点 dialogue 原文,不得进专家视图
#            (与 full-context 同一信息边界);quality/debug 供平台**内部**决定要不要建单,
#            同样不得展示给专家。
#   2026-09-20 变更:索引与详情新增 quality / consistency / branch_source / debug;
#            `/api/runs` 默认排除 quality=questionable 与 debug,并在 excluded 里报明
#            (要全量加 ?include_questionable=1)。专家全文(full-context)**不受影响**:
#            它仍然不含任何分支/判定/预设等实验元信息。
#   2026-10-04 变更:索引与详情**仅追加** manifest_status / manifest_warning_count /
#            manifest_warnings 三个字段(读侧透出 run.json 的 manifest.manifest_warnings)。
#            它们**不参与 quality 判定、不改变默认排除集**;警告原文含"规则判定没有采样温度"
#            这类如实描述,当质量问题用会把降级跑一律藏掉。同 manifest 本体一样**不得进专家视图**。
openapi: 3.1.0
info:
  title: GTC Case 01 · Run 只读数据服务
  description: 向 Governance Platform 提供 Case 01 已完成 Run 的索引、结构化治理数据(Raw Reflection
    / Router / Audit)与专家 Full Context自然语言全文。只读。
  version: 0.1.0
paths:
  /:
    get:
      tags:
      - meta
      summary: Index
      operationId: index__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Index  Get
  /api/runs:
    get:
      tags:
      - runs
      summary: List Runs
      description: |-
        全部已完成 Run 的索引(简短字段;branch 仅供平台内部关联使用)。

        **默认会少给四类记录**(2026-09-20 起,2026-09-24 加 deprecated,2026-10-04 与
        评审侧 `live/history._HIDDEN_QUALITY` 对齐加 unreadable):
        - `quality=questionable`:预设分支与 Investment AI 的 T0 立场自相矛盾、判定失败(停在 T0)、
          或反思压根没生成的记录;
        - `quality=debug`:调试跑(如 `--nodes` 截断,内容不完整);
        - `quality=deprecated`:记录被显式标废弃(样本作废);
        - `quality=unreadable`:有 run 目录但 `run.json` 不在(该次 run 未落盘)。
          本接口今天取不到这一类(索引只吃落盘记录),列在这里是为了两处口径一致。
        少给了什么**不静默**:响应里的 `excluded` 会给出计数、run_id 与原因。
        需要全量时加 `?include_questionable=1`。
        `quality=unverified`(旧记录没有一致性戳)照常返回 —— 判不了 ≠ 有问题。
        `manifest_status`/`manifest_warnings`(2026-10-04 加,仅追加)**不在这四类里**:
        有警告≠该条不能用,历史无清单的记录记 `absent`。
      operationId: list_runs_api_runs_get
      parameters:
      - name: include_questionable
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: true = 连 questionable/debug/deprecated/unreadable 一起返回(默认 false)。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: RunsList
                properties:
                  runs:
                    type: array
                    description: 全部已完成 Run 的简短索引(按结束日期倒序)。
                    items:
                      $ref: '#/components/schemas/RunSummary'
                  count:
                    type: integer
                    description: Run 数量。
                  filter:
                    type: object
                    description: 本次请求实际用的过滤开关(回显)。
                    additionalProperties: true
                  excluded:
                    type: object
                    description: |-
                      被默认排除的记录(仅在真的有排除时出现)。
                      `count`/`by_kind`(按 quality 分类的 run_id 列表)/`reason`。
                required:
                - runs
                - count
  /api/expert-categories:
    get:
      tags:
      - experts
      summary: Expert Categories
      description: Router 当前使用的专家类别池。只含类别定义，不含具体专家人员或可用状态。
      operationId: expert_categories_api_expert_categories_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpertCategory'
                required: [version, categories]
  /api/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Run Detail
      description: '单个 Run 详情。


        Platform 侧用于:按问题建 Expert Review Task、关联审计时间线、判断


        Reflection / Router 是否已就绪。专家看到的文本一律走 full-context。


        服务端返回的是聚合 meta(n_turns 等为计数);若平台需要 turns/retrievals/


        events/state_history/condition_monitor 全文,另行约定。此处绝不含实现侧


        附加键 summary/injector/compat——它们只在 run.json 落盘,平台不读,


        其中 injector 含 Branch 实验元信息,不得进专家视图。'
      operationId: run_detail_api_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: RunDetail
                # 严格度说明(与 Issue 不同):RunDetail 是只读聚合展示面,顶层刻意
                # 不设 additionalProperties:false / required,以容纳对接确认单允许
                # 的"仅追加 add-only"扩展;而 Issue 是平台建单/幂等契约,须闭合。
                properties:
                  run_id:
                    type: string
                    description: Run 标识(作为复合主键的组成部分)。
                  start_date:
                    type: string
                    description: Run 开始日期(YYYY-MM-DD)。
                  end_date:
                    type: string
                    description: Run 结束日期(YYYY-MM-DD)。
                  branch:
                    type: string
                    description: 分支标签;仅供平台内部关联,不对外叙事。
                  branch_summary:
                    type: string
                    description: 分支的人话摘要。
                  n_turns:
                    type: integer
                    description: 对话回合数。
                  n_retrievals:
                    type: integer
                    description: 检索条数。
                  n_events:
                    type: integer
                    description: 公开事件条数。
                  final_feedback_date:
                    type: string
                    description: 最终反馈日期(YYYY-MM-DD),空串表示无。
                  reflection:
                    type: object
                    title: ReflectionBlock
                    properties:
                      generated:
                        type: boolean
                        description: Reflection 是否已生成。
                      text:
                        type: string
                        description: Reflection 原文(专家结构审核的依据)。
                      quality:
                        $ref: '#/components/schemas/ReflectionQuality'
                    required:
                    - generated
                    - text
                  router:
                    type: object
                    title: RouterBlock
                    description: Router 拆分结果。issues[].id 是 run 内序号,跨 run
                      会重名;平台建单/幂等主键必须是 (run_id, issue_id)。
                    properties:
                      ran:
                        type: boolean
                        description: Router 是否已运行。
                      issues:
                        type: array
                        description: 拆分出的待专业审核问题。
                        items:
                          $ref: '#/components/schemas/Issue'
                      postprocess:
                        $ref: '#/components/schemas/RouterPostprocess'
                    required:
                    - ran
                    - issues
                  audit:
                    type: array
                    description: 该 Run 世界侧动作时间线(释放事件/买卖/状态推进)。
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/full-context:
    get:
      tags:
      - runs
      summary: Full Context
      description: '专家“View Full Context”:自然语言完整记录。


        内容与信息边界见 full_context.build_full_context;不含 Branch 预设等


        实验元信息(即不含 injector 段任何字段)。'
      operationId: full_context_api_runs__run_id__full_context_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: FullContext
                properties:
                  run_id:
                    type: string
                    description: Run 标识。
                  format:
                    type: string
                    description: '"text/plain; charset=utf-8" —— 全文为纯文本。'
                  full_context:
                    type: string
                    description: 专家可读的自然语言完整记录,不含实验元信息。
                required:
                - run_id
                - format
                - full_context
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/review-package/{run_id}:
    get:
      tags:
      - review-package
      summary: Review Package
      description: |-
        平台建单用**只读交接包**(2026-10-05 补入契约)。与实时 case 无关:
        不分配专家、不接收审核写回。

        与完整的 run.json 相比,交接包按实验边界裁剪:不含 `injector`
        (Branch 实验元信息 + 逐节点 dialogue 原文)、`branch` 等实验底牌;
        只保留平台建单需要的快照、任务候选与专家全文。

        **状态码语义(平台据此分支处理,不许只看 200)**:
        - 200 `ok=true`:正常返回,`data` 为交接包;
        - 404 `invalid_run_id` / `run_not_found`:run_id 非法或该记录不存在;
        - 422 `invalid_review_record_or_catalog`:记录格式错,或**类别目录/根目录配置不可用**
          (含 `CASE01_RUNS_ROOT` 给相对路径的情形);
        - 503 `review_source_unavailable`:记录或类别目录暂不可读(IO)。

        响应带 `ETag`(取 `data.revision`)与 `Cache-Control: no-store`。
      operationId: review_package_api_review_package__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: ReviewPackageEnvelope
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    additionalProperties: true
                    description: 交接包(Pydantic `ReviewPackageResponse` 的序列化;
                      字段含义见 case01/docs/平台对接说明.md)。
                required:
                - ok
                - data
        '404':
          description: Run 不存在或路径非法(invalid_run_id / run_not_found)
        '422':
          description: 记录或类别目录格式错误(invalid_review_record_or_catalog)
        '503':
          description: 记录或类别目录暂不可读(review_source_unavailable)
  /api/run-detail/{source}/{run_id}:
    get:
      tags:
      - runs
      summary: Run Detail
      description: |-
        共享只读详情:按 `source` 返回该 run 的数据,供历史界面自渲染
        (与"当前跑哪个 case"无关)。`source ∈ {review, checkpoint, compressed}`;
        路径白名单,杜绝穿越。

        **默认给"专家安全视图"**(与 full-context 同一信息边界):case01 成品只回
        `expert_safe_record()` 白名单里的键。要原始全文(内部排查/引擎侧)加 `?raw=1`。
        相对 `CASE01_RUNS_ROOT` 等根目录配置时返回 422 并带原因(2026-10-05 修)。
      operationId: run_detail_api_run_detail__source___run_id__get
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
          title: Source
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: raw
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Raw
        description: 为 true 时返回原始 run.json(非专家安全视图)。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: RunDetail
        '404':
          description: run_id 非法或该记录不存在
        '422':
          description: 数据根配置不可解析(如相对路径)
  /embed/explore:
    get:
      tags:
      - embed
      summary: Explore Page
      description: 数据界面(纯数据浏览,不依赖运行状态);由 history.html 渲染。
        返回 HTML,不是 JSON —— 供平台 iframe 嵌入。
      operationId: explore_page_embed_explore_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    RunSummary:
      type: object
      description: Run 索引条目。
      properties:
        run_id:
          type: string
          description: Run 标识。
        quality:
          type: string
          enum: [ok, questionable, debug, unverified, deprecated]
          description: |-
            质检标记(2026-09-20 加,加法字段)。
            ok=分支与 T0 立场一致(或由 T0 判定);questionable=预设分支与 T0 立场矛盾、
            判定失败(停在 T0)或反思未生成;debug=调试跑(内容不完整);
            deprecated=记录被显式标废弃(样本作废);unverified=旧记录没有一致性戳。
            默认只返回 ok / unverified;另有 `unreadable`(有 run 目录但 run.json 不在)
            也在默认排除之列,它由评审侧的占位行造出,本接口当前取不到。
        consistency:
          type: string
          enum: [consistent, inconsistent, unknown, unverified]
          description: T0 立场与该 Run 分支的一致性判定结果。
        branch_source:
          type: string
          description: 分支从哪来(preset=运行参数指定 / judge=由 T0 回答判定)。
        debug:
          type: string
          description: 调试跑说明(空串=正式跑);用于解释 quality=debug 的原因。
        reason:
          type: string
          description: |-
            质检判定理由(2026-10-03 加,本文件此前漏记 —— 平台照 YAML 实现时读不到它)。
            `quality=unverified` 时分得出"没验过"与"验了但判不了",并给出为什么。
        deprecated:
          type: boolean
          description: 记录是否被显式标废弃(样本作废);平台要能自己筛,不能只靠默认隐藏。
        deprecated_reason:
          type: string
          description: 废弃原因原文(空串表示未标废弃)。
        manifest_status:
          type: string
          enum: [absent, clean, noted, error, unverified]
          description: |-
            运行清单(manifest)的警告状态(2026-10-04 加,仅追加;**不影响 quality**)。
            absent=这条记录没有清单段(2026-10-04 之前的历史产物);
            clean=有清单且零警告;noted=有警告(原文见 manifest_warnings);
            error=清单自身生成失败(manifest_error),即这条记录的复现指纹不可信;
            unverified=质检取不到判定,连清单状态也判不了(≠ absent)。
        manifest_warning_count:
          type: integer
          description: 警告总条数(全量,不受 manifest_warnings 的展示条数上限影响)。
        manifest_warnings:
          type: array
          description: |-
            警告原文,最多透出 8 条(超出部分只进 count)。给平台**内部**排查用:
            "判官未启用""资料目录读不到""后端判不出来"这类事实以前只在日志里,
            现在这条索引能看到。不得进专家视图(与 manifest 本体同一边界)。
          items:
            type: string
        start_date:
          type: string
          description: 开始日期。
        end_date:
          type: string
          description: 结束日期。
        branch:
          type: string
          description: 分支标签(平台内部关联用)。
        branch_summary:
          type: string
          description: 分支人话摘要。
        n_turns:
          type: integer
          description: 对话回合数。
        n_retrievals:
          type: integer
          description: 检索条数。
        has_reflection:
          type: boolean
          description: 是否已有 Reflection。
        router_issue_count:
          type: integer
          description: Router 拆分出的问题数。
      required:
      - run_id
      - start_date
      - end_date
      - branch
      - branch_summary
      - n_turns
      - n_retrievals
      - has_reflection
      - router_issue_count
    Issue:
      type: object
      description: 'Router 拆分出的一个待审核问题。id 是 run 内序号(issue-1..issue-N),
        跨 run 会重名;平台建单/幂等主键必须是 (run_id, issue_id) —— 否则不同 run 各自的
        issue-1 会被错配成同一条任务(见 prose 契约 §2.2)。'
      properties:
        id:
          type: string
          description: run 内序号,形如 issue-1..issue-N。
        summary:
          type: string
          description: 问题摘要(自然语言)。
        field:
          type: string
          description: 规范专家类别名称；未匹配时保留 Router 建议的自由文本。
        expert_category_id:
          type: string
          description: 专家池稳定类别 ID；未匹配时为空串。
        secondary_expert_category_ids:
          type: array
          items:
            type: string
          description: 同一问题确需多个专业时的辅助类别 ID。
        match_status:
          type: string
          enum: [matched, unmatched]
        suggested_field:
          type: string
          description: unmatched 时 Router 建议的新专业领域。
        evidence_quote:
          type: string
          description: 程序根据 evidence_sentence_ids 回填的 Reflection 逐字原文。
        evidence_sentence_ids:
          type: array
          items:
            type: string
          description: Router 引用的本次 Reflection 临时句子编号(S001...)。
        invalid_evidence_sentence_ids:
          type: array
          items:
            type: string
          description: Router 返回但本次编号表中不存在的 ID；非空时 evidence_status=invalid。
        model_evidence_quote:
          type: string
          description: 兼容旧 Router 的自由文本引用；新路径不依赖它建立证据。
        evidence_status:
          type: string
          enum: [verified, missing, invalid, unchecked]
          description: evidence_quote 是否能在 Reflection 原文中验证。
        risk_note:
          type: string
          description: 该行为或判断的具体风险。
        risk:
          type: string
          enum: [low, medium, high]
          description: 风险等级,路由代码 `_parse_router_json` 归一化为小写;非法值落回
            medium。比较时应忽略大小写(兼容历史大写记录)。
        routing_reason:
          type: string
          description: 路由理由,说明为何需要该领域专家。
        style:
          type: string
          enum: [behavior, question]
          description: summary 是否已满足行为/判断陈述句要求。
        merged_from_issue_ids:
          type: array
          items:
            type: string
          description: 被合并进当前根因的 Router 原始临时问题 ID。
      required:
      - id
      - summary
      - field
      - risk
      - routing_reason
      additionalProperties: false
    RouterPostprocess:
      type: object
      description: Router 确定性后处理统计，用于审计过滤、合并和数量截断。
      properties:
        raw_issue_count:
          type: integer
