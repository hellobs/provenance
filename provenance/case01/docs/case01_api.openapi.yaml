# GTC Case 01 · Run 只读数据服务 —— 机器可读契约(OpenAPI 3.1)
#
# 本文件只覆盖【平台对接端点】;/api/runs、/api/runs/{run_id}、
# /api/runs/{run_id}/full-context 是平台侧的正式对接面。
# 不含 /viewer:它是引擎侧调试挂载(serve.app.mount("/viewer", StaticFiles),
# 依赖 gitignored 的 runs_html/ 目录,且 FastAPI 自身的 /openapi.json 也不含它,
# 不是 API 操作端点、不是平台对接面)。详见 prose 契约 Governance平台对接说明.md §1.1。
#
# 顶层键读/写约定(对应 run.json;页面 prose 契约 §2.2):
#   平台要读:run_id / 日期 / turns / retrievals / events / state_history /
#            final_feedback / audit / condition_monitor / reflection / router。
#   引擎侧附加键、平台不读:summary / injector / compat / quality / debug。
#            其中 injector 含 Branch 实验元信息与逐节点 dialogue 原文,不得进专家视图
#            (与 full-context 同一信息边界);quality/debug 供平台**内部**决定要不要建单,
#            同样不得展示给专家。
#   2026-09-20 变更:索引与详情新增 quality / consistency / branch_source / debug;
#            `/api/runs` 默认排除 quality=questionable 与 debug,并在 excluded 里报明
#            (要全量加 ?include_questionable=1)。专家全文(full-context)**不受影响**:
#            它仍然不含任何分支/判定/预设等实验元信息。
openapi: 3.1.0
info:
  title: GTC Case 01 · Run 只读数据服务
  description: 向 Governance Platform 提供 Case 01 已完成 Run 的索引、结构化治理数据(Raw Reflection
    / Router / Audit)与专家 Full Context自然语言全文。只读。
  version: 0.1.0
paths:
  /:
    get:
      tags:
      - meta
      summary: Index
      operationId: index__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Index  Get
  /api/runs:
    get:
      tags:
      - runs
      summary: List Runs
      description: |-
        全部已完成 Run 的索引(简短字段;branch 仅供平台内部关联使用)。

        **默认会少给两类记录**(2026-09-20 起):
        - `quality=questionable`:预设分支与 Investment AI 的 T0 立场自相矛盾的记录;
        - `quality=debug`:调试跑(如 `--nodes` 截断,内容不完整)。
        少给了什么**不静默**:响应里的 `excluded` 会给出计数、run_id 与原因。
        需要全量时加 `?include_questionable=1`。
        `quality=unverified`(旧记录没有一致性戳)照常返回 —— 判不了 ≠ 有问题。
      operationId: list_runs_api_runs_get
      parameters:
      - name: include_questionable
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: true = 连 questionable/debug 一起返回(默认 false)。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: RunsList
                properties:
                  runs:
                    type: array
                    description: 全部已完成 Run 的简短索引(按结束日期倒序)。
                    items:
                      $ref: '#/components/schemas/RunSummary'
                  count:
                    type: integer
                    description: Run 数量。
                  filter:
                    type: object
                    description: 本次请求实际用的过滤开关(回显)。
                    additionalProperties: true
                  excluded:
                    type: object
                    description: |-
                      被默认排除的记录(仅在真的有排除时出现)。
                      `count`/`by_kind`(按 quality 分类的 run_id 列表)/`reason`。
                required:
                - runs
                - count
  /api/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Run Detail
      description: '单个 Run 详情。


        Platform 侧用于:按问题建 Expert Review Task、关联审计时间线、判断


        Reflection / Router 是否已就绪。专家看到的文本一律走 full-context。


        服务端返回的是聚合 meta(n_turns 等为计数);若平台需要 turns/retrievals/


        events/state_history/condition_monitor 全文,另行约定。此处绝不含引擎侧


        附加键 summary/injector/compat——它们只在 run.json 落盘,平台不读,


        其中 injector 含 Branch 实验元信息,不得进专家视图。'
      operationId: run_detail_api_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: RunDetail
                # 严格度说明(与 Issue 不同):RunDetail 是只读聚合展示面,顶层刻意
                # 不设 additionalProperties:false / required,以容纳对接确认单允许
                # 的"仅追加 add-only"扩展;而 Issue 是平台建单/幂等契约,须闭合。
                properties:
                  run_id:
                    type: string
                    description: Run 标识(作为复合主键的组成部分)。
                  start_date:
                    type: string
                    description: Run 开始日期(YYYY-MM-DD)。
                  end_date:
                    type: string
                    description: Run 结束日期(YYYY-MM-DD)。
                  branch:
                    type: string
                    description: 分支标签;仅供平台内部关联,不对外叙事。
                  branch_summary:
                    type: string
                    description: 分支的人话摘要。
                  n_turns:
                    type: integer
                    description: 对话回合数。
                  n_retrievals:
                    type: integer
                    description: 检索条数。
                  n_events:
                    type: integer
                    description: 公开事件条数。
                  final_feedback_date:
                    type: string
                    description: 最终反馈日期(YYYY-MM-DD),空串表示无。
                  reflection:
                    type: object
                    title: ReflectionBlock
                    properties:
                      generated:
                        type: boolean
                        description: Reflection 是否已生成。
                      text:
                        type: string
                        description: Reflection 原文(专家结构审核的依据)。
                    required:
                    - generated
                    - text
                  router:
                    type: object
                    title: RouterBlock
                    description: Router 拆分结果。issues[].id 是 run 内序号,跨 run
                      会重名;平台建单/幂等主键必须是 (run_id, issue_id)。
                    properties:
                      ran:
                        type: boolean
                        description: Router 是否已运行。
                      issues:
                        type: array
                        description: 拆分出的待专业审核问题。
                        items:
                          $ref: '#/components/schemas/Issue'
                    required:
                    - ran
                    - issues
                  audit:
                    type: array
                    description: 该 Run 世界侧动作时间线(释放事件/买卖/状态推进)。
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runs/{run_id}/full-context:
    get:
      tags:
      - runs
      summary: Full Context
      description: '专家“View Full Context”:自然语言完整记录。


        内容与信息边界见 full_context.build_full_context;不含 Branch 预设等


        实验元信息(即不含 injector 段任何字段)。'
      operationId: full_context_api_runs__run_id__full_context_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: FullContext
                properties:
                  run_id:
                    type: string
                    description: Run 标识。
                  format:
                    type: string
                    description: '"text/plain; charset=utf-8" —— 全文为纯文本。'
                  full_context:
                    type: string
                    description: 专家可读的自然语言完整记录,不含实验元信息。
                required:
                - run_id
                - format
                - full_context
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    RunSummary:
      type: object
      description: Run 索引条目。
      properties:
        run_id:
          type: string
          description: Run 标识。
        quality:
          type: string
          enum: [ok, questionable, debug, unverified]
          description: |-
            质检标记(2026-09-20 加,加法字段)。
            ok=分支与 T0 立场一致(或由 T0 判定);questionable=预设分支与 T0 立场矛盾;
            debug=调试跑(内容不完整);unverified=旧记录没有一致性戳。
            默认只返回 ok / unverified。
        consistency:
          type: string
          enum: [consistent, inconsistent, unknown, unverified]
          description: T0 立场与该 Run 分支的一致性判定结果。
        branch_source:
          type: string
          description: 分支从哪来(preset=运行参数指定 / judge=由 T0 回答判定)。
        debug:
          type: string
          description: 调试跑说明(空串=正式跑);用于解释 quality=debug 的原因。
        start_date:
          type: string
          description: 开始日期。
        end_date:
          type: string
          description: 结束日期。
        branch:
          type: string
          description: 分支标签(平台内部关联用)。
        branch_summary:
          type: string
          description: 分支人话摘要。
        n_turns:
          type: integer
          description: 对话回合数。
        n_retrievals:
          type: integer
          description: 检索条数。
        has_reflection:
          type: boolean
          description: 是否已有 Reflection。
        router_issue_count:
          type: integer
          description: Router 拆分出的问题数。
      required:
      - run_id
      - start_date
      - end_date
      - branch
      - branch_summary
      - n_turns
      - n_retrievals
      - has_reflection
      - router_issue_count
    Issue:
      type: object
      description: 'Router 拆分出的一个待审核问题。id 是 run 内序号(issue-1..issue-N),
        跨 run 会重名;平台建单/幂等主键必须是 (run_id, issue_id) —— 否则不同 run 各自的
        issue-1 会被错配成同一条任务(见 prose 契约 §2.2)。'
      properties:
        id:
          type: string
          description: run 内序号,形如 issue-1..issue-N。
        summary:
          type: string
          description: 问题摘要(自然语言)。
        field:
          type: string
          description: 专业类别,用于匹配专家池。
        risk:
          type: string
          enum: [low, medium, high]
          description: 风险等级,路由代码 `_parse_router_json` 归一化为小写;非法值落回
            medium。比较时应忽略大小写(兼容历史大写记录)。
        routing_reason:
          type: string
          description: 路由理由,说明为何需要该领域专家。
      required:
      - id
      - summary
      - field
      - risk
      - routing_reason
      additionalProperties: false
    AuditEntry:
      type: object
      description: 世界侧动作时间线单条。
      properties:
        t:
          type: string
          description: 日期。
        action:
          type: string
          description: 动作。
        kind:
          type: string
          description: 类别。
        summary:
          type: string
          description: 摘要。
      additionalProperties: true
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError