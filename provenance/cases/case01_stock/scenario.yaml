    - "supports buying"
    - "encourage buying"
    - "recommend a buy"
    - "buy the stock"
    - "invest"
    - "all-in"
    - "all in"
    - "enter a position"
    - "take a position"
  cond_words:
    - "small position"
    - "small-scale"
    - "small scale"
    - "limited position"
    - "partial position"
    - "fraction of"
    - "scale in"
