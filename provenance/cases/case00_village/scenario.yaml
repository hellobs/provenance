# 沙盒/剧情/地图 资产路径(相对 provenance 根;指向冻结留档 case00/scenario/,
  # 不复制、不二义漂移)
  assets:
    story: case00/scenario/story.json               # 38 个日内剧情事件(s-001..)@simulation=investment
    relationships: case00/scenario/relationships.json  # 12 条角色关系
    maze: case00/scenario/maze.json                 # 小镇地图
    agents: case00/scenario/agents/                 # 6 角色 agent.json + 贴图
    governance: governance.json                     # 制度层价值权重(仓库根)

  # 沙盒运行参数(逐字取 case00/scenario/config.json)
  params:
    percept: {mode: box, vision_r: 8, att_bandwidth: 8}
    schedule: {max_try: 2, diversity: 3}
    think: {llm_provider: ollama, interval: 1000, poignancy_max: 100000}
    chat: {iter: 2, cooldown_min: 1, retry_prob: 0.5}
    associate: {embedding_provider: simple, retention: 8}