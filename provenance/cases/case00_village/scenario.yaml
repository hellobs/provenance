# ============================================================
# scenario.yaml — Case 00 场景声明式定义(引擎加载/校验,语义透传)
# case_id = case00_village = cases/ 下目录名。
#
# 过渡态约定(2026-09-20,用户拍板:仅声明化不重写语义):
#   case00 = provenance 原生的 6 角色投资咨询**沙盒**仿真(移动/感知/调度/
#   关系/价值倾向演化)。case_engine 暂不建模这些沙盒原语,本文件只做**声明**:
#   - 引擎侧:roles/meta 可加载、可校验(满足 case_engine 的 Validate 契约);
#   - 沙盒侧:价值权重(value_tendency)、资产路径(assets)、沙盒参数(params)统一落在
#     `world` 标准段(不设 custom 逃生舱);**语义仍由旧沙盒引擎持有**
#   本文件不改动、不复制运行语义;资产路径指向冻结留档 case00/scenario/。
# 价值数据逐字取自 governance.json 与各 agent.json(忠实原文,不做润色/改动)。
# ============================================================

meta:
  case_id: case00_village
  name: "6 角色投资咨询中心"
  description: "provenance 原生的 6 角色多 agent 投资咨询沙盒:角色在投资咨询中心按制度约束与剧情事件连续仿真,价值倾向(value_tendency)随交互演化"
  engine: sandbox-value             # 推荐/默认引擎(价值权重沙盒);运行时可 --engine 覆盖
  simulation: "investment"          # 取自 story/relationships 的 simulation 字段
  start_date: "2025-02-13"          # live_fastapi 的 --start(沙盒墙钟起始)
  runtime: "live_fastapi.py(5001) + live/"   # 过渡:沙盒语义仍由旧引擎持有

# ---- 角色(引擎 Validate:非空唯一 id;role_type 复刻 agent.json) ----
roles:
  - id: ai_advisor
    display_name: "AI Advisor"
    type: ai_tool                   # 制度内建(agent.json: role_type = ai_tool)
    llm: local
    # 完整角色定义(learned/duty/rules/目前状态)见
    # case00/scenario/agents/AI Advisor/agent.json
  - id: daniel_shen
    display_name: "Daniel Shen"
    type: user                      # 首席投资顾问(agent.json: role_type = user)
    llm: local
  - id: kevin_su
    display_name: "Kevin Su"
    type: user                      # 量化交易分析师
    llm: local
  - id: michael_chen
    display_name: "Michael Chen"
    type: user                      # 研究员/分析师
    llm: local
  - id: wendy_lin
    display_name: "Wendy Lin"
    type: user                      # 风控/合规官
    llm: local
  - id: mr_zhou
    display_name: "Mr. Zhou"
    type: user                      # 资深散户(高频求教者)
    llm: local

# ---- 价值权重:引擎标准段(note case00 的状态是每角色的权重向量,非 case01 的
#      单个主角 state_schema;经 world.value_tendency 供 sandbox-value 预检消费) ----
world:
  value_tendency:
    # 制度层价值权重(逐字取 governance.json;6 角色 × 3~4 维)
