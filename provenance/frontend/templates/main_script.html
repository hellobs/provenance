			html += '<div style="display:flex; align-items:center; gap:4px;"><span style="flex:0 0 34px; color:#999; font-size:9px;">约束</span><div style="flex:1; height:7px; background:#f0f0f0; border-radius:3px;"><div style="width:' + wbar + '%; height:7px; background:#bbb; border-radius:3px;"></div></div><span style="flex:0 0 30px; text-align:right; color:#777; font-size:9px;">' + wbar + '%</span></div>';
			html += '<div style="display:flex; align-items:center; gap:4px;"><span style="flex:0 0 34px; color:' + color + '; font-size:9px;">倾向</span><div style="flex:1; height:7px; background:#f0f0f0; border-radius:3px;"><div data-tend-fill-for="' + goalsEscape(a) + '_' + goalsEscape(g) + '" style="width:' + tvbar + '%; height:7px; background:' + color + '; border-radius:3px;"></div></div><span data-tend-pct-for="' + goalsEscape(a) + '_' + goalsEscape(g) + '" style="flex:0 0 30px; text-align:right; font-size:9px; color:#333;">' + (tv !== null ? tvbar + '%' : '--') + '</span></div>';
			html += '</div>';
			// Δ 变化量
			if (tv !== null) {
				var dTxt = (delta >= 0 ? "+" : "") + (Math.round(delta * 1000) / 10) + "pp";
				html += '<span data-tend-delta-for="' + goalsEscape(a) + '_' + goalsEscape(g) + '" style="flex:0 0 46px; text-align:right; font-size:9px; color:' + (Math.abs(delta) < 0.01 ? "#999" : (delta > 0 ? "#e07b39" : "#2f9e44")) + ';">Δ ' + dTxt + '</span>';
			} else {
				html += '<span data-tend-delta-for="' + goalsEscape(a) + '_' + goalsEscape(g) + '" style="flex:0 0 46px; text-align:right; font-size:9px; color:#aaa;">Δ --</span>';
			}
			html += '</div>';
		}
		html += '</div>';
		// 约束滑条(可调)
		for (var j = 0; j < names.length; j++) {
			var g2 = names[j];
			var w2 = Math.round((goals[g2] || 0) * 100);
			html += '<div style="display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:3px 0;">';
			html += '<span style="flex:1 1 100px; min-width:60px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#555; text-align:left; line-height:1.3;" title="' + goalsEscape(g2) + '">' + goalsEscape(g2) + '</span>';
			html += '<input type="range" min="0" max="100" value="' + w2 + '" style="width:64px; flex:0 0 auto;" data-agent="' + goalsEscape(a) + '" data-goal="' + goalsEscape(g2) + '">';
			html += '<span style="width:30px; text-align:right; color:#333; flex:0 0 auto;" data-weight-for="' + goalsEscape(g2) + '">' + w2 + '%</span>';
			html += '<button class="del-btn" style="margin-left:auto; padding:1px 6px; font-size:10px; flex:0 0 auto;" data-del-goal="' + goalsEscape(g2) + '" data-del-agent="' + goalsEscape(a) + '">移除</button>';
			html += '</div>';
		}
		html += '<div style="margin-top:4px; display:flex; gap:4px;">';
		html += '<input type="text" placeholder="添加目标" style="flex:1; padding:2px 6px; font-size:11px;" data-new-goal="' + goalsEscape(a) + '">';
		html += '<button class="del-btn" style="background:#2d6cdf; padding:2px 8px; font-size:10px;" data-add-goal="' + goalsEscape(a) + '">+</button>';
		html += '</div>';
		html += '<div style="font-size:10px; color:#888;">合计: <span data-sum-for="' + goalsEscape(a) + '"></span></div>';
		html += '</div>';
		body.innerHTML = html;
		goalsUpdateSums();
		drawTendencyChart(a);
		updateTendencyLegend(a);
		// 嵌入模式:explain → 自动展开当前角色解释面板;goals → 收起其他列
		var embedMode = document.body.getAttribute("data-embed") || "";
		if (embedMode === "explain") {
			var eb = body.querySelector('[data-explain-for="' + goalsEscape(a) + '"]');
			if (eb) eb.click();
		}
	}

	function goalsUpdateSums() {
		var agents = Object.keys(goalsData);
		for (var i = 0; i < agents.length; i++) {
			var a = agents[i];
			var sum = 0;
			var goals = goalsData[a] || {};
			for (var g in goals) sum += goals[g];
			var el = document.querySelector('[data-sum-for="' + a + '"]');
			if (el) {
				el.textContent = (Math.round(sum * 100) / 100).toFixed(2);
				el.style.color = Math.abs(sum - 1) < 0.001 ? "#070" : "#a00";
			}
		}
	}

	function goalsNormalize(agentName) {
		// Re-normalize weights to sum to 1 (keep relative proportions)
		var goals = goalsData[agentName] || {};
		var total = 0;
		for (var g in goals) total += goals[g];
		if (total <= 0) return;
		for (var g in goals) goals[g] = goals[g] / total;
		goalsData[agentName] = goals;
	}

	function goalsPush(agentName) {
		var goals = {};
		var src = goalsData[agentName] || {};
		// 过滤 0 权重项:添加目标后未拖动前权重为 0,不提交(避免垃圾干预)
		for (var g in src) {
			if (src[g] > 0) goals[g] = src[g];
		}
		if (Object.keys(goals).length === 0) return;
		// 提交前归一化(删除目标后剩余总和≠1,后端会拒绝;必须归一化到1)
		var gsum = 0;
		for (var gg in goals) gsum += goals[gg];
		if (gsum > 0) {
			for (var gg2 in goals) goals[gg2] = goals[gg2] / gsum;
		}
		goalsNormalize(agentName);
		goalsRender();
		// debounce 400ms(拖动结束才提交,避免拖动过程产生大量干预记录)
		if (goalsTimer) clearTimeout(goalsTimer);
		goalsTimer = setTimeout(function() {
			// 干预备注:提交前弹窗让专家填写理由(可留空),记录进 interventions.json
			// 支撑"记录参与过程/为何调整"叙事;测试/嵌入页可用 ?no-note=1 跳过
			var note = "";
			try {
				var noNote = new URLSearchParams(location.search).get("no-note") === "1";
				if (!noNote) note = window.prompt("干预理由(可选,将记录到干预审计与时间轴):\n例:监管新规,上调风控权重", "") || "";
			} catch (err) { note = ""; }
			fetch("/api/goals", {
				method: "POST",
				headers: {"Content-Type": "application/json"},
				body: JSON.stringify({name: agentName, goals: goals, note: note})
			}).then(function(r) { return r.json(); }).then(function(out) {
				if (!out.ok) console.warn("goals update failed:", out.errors);
				// 干预成功:刷新时间轴(新事件出现);goals-body 存在才需要(时间轴轮询也会刷)
				if (document.getElementById("timeline-body")) timelineRefresh();
			}).catch(function(e) { console.warn("goals update error:", e); });
		}, 400);
	}

	// ================= 价值倾向演变曲线(核心观测对象) =================
	// tendencyHistory[agent] = [{t: "20250213-09:30", v: {goal: weight}}]
	var tendencyHistory = {};
	var TEND_COLORS = ["#2d6cdf", "#e07b39", "#2f9e44", "#c92a2a", "#9c36b5", "#0b7285"];

	// 按模拟时间去重记录倾向;同时间更新、新时间追加(阶梯=行动变化点)
	function tendencyRecord(agentName, timeStr, tendency) {
		if (!agentName || !tendency) return;
		var hist = tendencyHistory[agentName] || (tendencyHistory[agentName] = []);
		var last = hist.length > 0 ? hist[hist.length - 1] : null;
		if (last && last.t === timeStr) {
			last.v = tendency;  // 同一时间刷新(去重)
		} else {
			hist.push({ t: timeStr || "", v: tendency });
			if (hist.length > 200) hist.shift();
		}
		// 同步当前倾向快照(文本/对照条数据源),局部刷新,不整页重绘(避免打断滑条)
		tendencyData[agentName] = tendency;
		drawTendencyChart(agentName);
		updateTendencyLegend(agentName);
		updateTendencyBars(agentName);
	}

	// 局部更新"约束 vs 倾向"对照条的倾向值 + Δ(仅当前详情角色可见时)
	function updateTendencyBars(agentName) {
		if (selectedAgent !== agentName) return;
		var tend = tendencyData[agentName] || {};
		var goals = goalsData[agentName] || {};
		for (var g in goals) {
			var tv = tend[g];
			if (tv === undefined) continue;
			var key = goalsEscape(agentName) + "_" + goalsEscape(g);
			var fill = document.querySelector('[data-tend-fill-for="' + key + '"]');
			var pct = document.querySelector('[data-tend-pct-for="' + key + '"]');
			var dlt = document.querySelector('[data-tend-delta-for="' + key + '"]');
			var tvbar = Math.round(tv * 100);
			if (fill) fill.style.width = tvbar + "%";
			if (pct) pct.textContent = tvbar + "%";
			if (dlt) {
				var w = goals[g] || 0;
				var delta = tv - w;
				var dTxt = (delta >= 0 ? "+" : "") + (Math.round(delta * 1000) / 10) + "pp";
				dlt.textContent = "Δ " + dTxt;
				dlt.style.color = Math.abs(delta) < 0.01 ? "#999" : (delta > 0 ? "#e07b39" : "#2f9e44");
			}
		}
	}

	function tendencyGoalColors(agentName) {
		// 该角色约束内目标的固定配色(与图例一致)
		var goals = goalsData[agentName] || {};
		var names = Object.keys(goals).sort();
		var map = {};
		for (var i = 0; i < names.length; i++) map[names[i]] = TEND_COLORS[i % TEND_COLORS.length];
		return map;
	}

	function drawTendencyChart(agentName, cvOverride, opts) {
		opts = opts || {};
		var scale = opts.scale || 1;
		var cv = cvOverride || document.querySelector('[data-tend-chart-for="' + agentName + '"]');
		if (!cv) return;
		var hist = tendencyHistory[agentName] || [];
		var PX = 10;  // 每个数据点最小像素宽(横向滚动由此撑开)
		var minW = 356;
		var cw = Math.max(minW, Math.max(1, hist.length) * PX);
		// 实时视图:按点数动态设宽(容器横向滚动);导出视图:宽度已在调用处按 scale 设好
		if (!opts.export && cv.width !== cw) cv.width = cw;
		var w = cv.width / scale;
		var h = cv.height / scale;
		var ctx = cv.getContext("2d");
		// 背景:实时用透明(容器底色),导出用纯白
		if (opts.export) { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h); }
		else { ctx.clearRect(0, 0, w, h); }
		if (hist.length === 0) {
			ctx.fillStyle = "#888"; ctx.font = "12px sans-serif";
			ctx.fillText("等待倾向数据...", 8, 18);
			return;
		}
		// 绘图区:导出模式顶部留标题,底部留图例
		// 导出模式布局:标题(22)/时间(40)/绘图区(56~h-76)/时间刻度(h-62)/图例(最多3行,向上生长)
		var top = opts.export ? 56 : 26;
		var bottom = opts.export ? 76 : 22;
		var plotH = h - top - bottom;
		var yOf = function(v) { return top + (1 - v) * plotH; };
		var n = hist.length;
		var xOf = function(i) { return 30 + (n === 1 ? 0 : i / (n - 1)) * (w - 60); };
		var colors = tendencyGoalColors(agentName);
		var names = Object.keys(colors);
		var goals = goalsData[agentName] || {};
		// 网格:0 / 0.25 / 0.5 / 0.75 / 1(略深,清晰)
		ctx.strokeStyle = "#dcdcdc"; ctx.lineWidth = 1;
		for (var gy = 0; gy <= 4; gy++) {
			var y = yOf(gy / 4);
			ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(w - 30, y); ctx.stroke();
		}
		// Y 轴线
		ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1;
		ctx.beginPath(); ctx.moveTo(30, top); ctx.lineTo(30, h - bottom); ctx.stroke();
		ctx.fillStyle = "#555"; ctx.font = "bold 11px sans-serif";
		ctx.textAlign = "right";
		ctx.fillText("1.0", 27, top + 4);          // 刻度放绘图区内侧,避开标题/时间行
		ctx.fillText("0.5", 27, yOf(0.5) + 4);
		ctx.fillText("0", 27, h - bottom - 2);
		ctx.textAlign = "left";
		// 导出模式:标题行(角色名 + 时间范围)
		if (opts.export) {
			ctx.fillStyle = "#333"; ctx.font = "bold 15px sans-serif";
			ctx.fillText(agentName + " — 价值倾向演变(内化)", 4, 22);
			ctx.font = "11px sans-serif"; ctx.fillStyle = "#777";
			var t0 = String(hist[0].t || "").slice(9);
			var t1 = String(hist[n - 1].t || "").slice(9);
			ctx.fillText("时间: " + t0 + " ~ " + t1, 4, 40);
		}
		// 约束期望虚线:每个目标一条(同色虚线,表示制度期望基准)
		for (var cg = 0; cg < names.length; cg++) {
			var cgoal = names[cg];
			var cw = goals[cgoal] || 0;
			if (cw <= 0) continue;
			ctx.strokeStyle = colors[cgoal];
			ctx.globalAlpha = 0.55;
			ctx.lineWidth = 1.6;
			ctx.setLineDash([6, 4]);
			var cy = yOf(cw);
			ctx.beginPath(); ctx.moveTo(30, cy); ctx.lineTo(w - 30, cy); ctx.stroke();
			ctx.setLineDash([]);
			ctx.globalAlpha = 1;
		}
		// 干预竖线:该角色的 interventions(按 sim_time 匹配 x 轴)
		var ivs = (interventionsData || []).filter(function(iv) {
			return iv.agent === agentName && iv.sim_time;
		});
		for (var iv = 0; iv < ivs.length; iv++) {
			var ivTime = String(ivs[iv].sim_time);
			for (var ii = 0; ii < n; ii++) {
				if (String(hist[ii].t) === ivTime) {
					var ivx = xOf(ii);
					ctx.strokeStyle = "rgba(130,130,130,0.75)"; ctx.lineWidth = 1.8;
						ctx.setLineDash([4, 3]);
						ctx.beginPath(); ctx.moveTo(ivx, top - 4); ctx.lineTo(ivx, h - bottom); ctx.stroke();
						ctx.setLineDash([]);
						ctx.fillStyle = "#8a8a8a"; ctx.font = "bold 9px sans-serif";
					ctx.fillText("干预", ivx + 3, top - 6);
					break;
				}
			}
		}
		// 各目标曲线
		for (var g = 0; g < names.length; g++) {
			var goal = names[g];
			ctx.strokeStyle = colors[goal];
			ctx.lineWidth = 2.6;
			ctx.beginPath();
			var started = false;
			for (var i = 0; i < n; i++) {
				var v = hist[i].v[goal];
				if (v === undefined) continue;
				var x = xOf(i), y = yOf(v);
				if (!started) { ctx.moveTo(x, y); started = true; }
				else ctx.lineTo(x, y);
			}
			if (started) ctx.stroke();
			// 最新值圆点 + 末值标注(白底,清晰可读)
			var lastV = hist[n - 1].v[goal];
			if (lastV !== undefined) {
				var lx = xOf(n - 1), ly = yOf(lastV);
				ctx.fillStyle = colors[goal];
				ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fill();
				ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
				ctx.stroke();
				var label = Math.round(lastV * 100) + "%";
				ctx.font = "bold 11px sans-serif";
				var tw = ctx.measureText(label).width;
				var bx = Math.max(2, Math.min(lx - tw - 8, w - tw - 4));
				var by = ly - 18;
				if (by < 8) by = ly + 12;
				ctx.fillStyle = "rgba(255,255,255,0.92)";
				ctx.fillRect(bx - 3, by - 10, tw + 6, 14);
				ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 1;
				ctx.strokeRect(bx - 3, by - 10, tw + 6, 14);
				ctx.fillStyle = colors[goal];
				ctx.fillText(label, bx, by);
			}
		}
		// X 轴:底部时间刻度(最多 6 个,均匀分布;只显示 HH:MM)
		ctx.strokeStyle = "#bbb"; ctx.lineWidth = 1;
		ctx.beginPath(); ctx.moveTo(30, h - bottom); ctx.lineTo(w - 30, h - bottom); ctx.stroke();
		ctx.fillStyle = "#555"; ctx.font = "bold 10px sans-serif";
		// 时间刻度基线:导出模式在轴线下 14px(给图例让出更底部一行),实时模式贴底
		var tickY = opts.export ? h - bottom + 14 : h - 7;
		var tickN = Math.min(6, n);
		var drawn = {};
		for (var tk = 0; tk < tickN; tk++) {
			var idx = Math.round(tk * (n - 1) / Math.max(1, tickN - 1));
			var tRaw = String(hist[idx].t || "");
			var tShort = tRaw.length > 9 ? tRaw.slice(9) : tRaw;  // 只显示 "HH:MM"
			if (drawn[tShort]) continue;
			drawn[tShort] = true;
			// 首尾刻度左/右对齐防裁剪,中间居中
			if (tk === 0) ctx.textAlign = "left";
			else if (tk === tickN - 1) ctx.textAlign = "right";
			else ctx.textAlign = "center";
			ctx.fillText(tShort, xOf(idx), tickY);
		}
		ctx.textAlign = "left";
		// 导出模式:底部图例行(独立一行,不与时间刻度重叠;超宽自动换行)
		if (opts.export) {
			ctx.font = "11px sans-serif";
			var lx = 4, ly = h - 24;
			var legendItems = [];
			for (var lg = 0; lg < names.length; lg++) {
				var lgoal = names[lg];
				legendItems.push({ color: colors[lgoal], text: " " + lgoal, dashed: false });
			}
			legendItems.push({ color: "#888", text: " 约束期望", dashed: true });
			for (var li = 0; li < legendItems.length; li++) {
				var item = legendItems[li];
				var iw = 13 + ctx.measureText(item.text).width + 16;
				if (lx + iw > w - 4 && lx > 4) {  // 超宽换行
					lx = 4;
					ly -= 14;
				}
				if (item.dashed) {
					ctx.strokeStyle = item.color;
					ctx.setLineDash([6, 4]); ctx.lineWidth = 1.4;
					ctx.beginPath(); ctx.moveTo(lx, ly + 5); ctx.lineTo(lx + 20, ly + 5); ctx.stroke();
					ctx.setLineDash([]);
					ctx.fillStyle = "#333";
					ctx.fillText(item.text, lx + 24, ly + 10);
				} else {
					ctx.fillStyle = item.color;
					ctx.fillRect(lx, ly, 10, 10);
					ctx.fillStyle = "#333";
					ctx.fillText(item.text, lx + 13, ly + 10);
				}
				lx += iw;
			}
		}
		// 悬停 tooltip:鼠标移到曲线区域,显示最近数据点的各目标值 + 干预信息
		// (仅实时视图启用;导出视图是静态 PNG 无交互)
		if (!opts.export && cv && typeof cv._tendHoverInit === "undefined") {
			cv._tendHoverInit = true;
			var _hist = hist;
			var _colors = colors;   // 捕获当前目标配色
			var _ivs = ivs;         // 捕获当前角色的干预列表
			var _agent = agentName;
			var _cv = cv;
			var _scale = scale;
			cv.addEventListener("mousemove", function (e) {
				var rect = _cv.getBoundingClientRect();
				var mx = (e.clientX - rect.left) * (_cv.width / rect.width);
				var my = (e.clientY - rect.top) * (_cv.height / rect.height);
				// 找到最近的点(按 x 距离)
				var nn = _hist.length;
				if (nn === 0) return;
				var best = -1, bd = 1e9;
				var plotW = (_cv.width / _scale) - 60;
				for (var pi = 0; pi < nn; pi++) {
					var px = 30 + (nn === 1 ? 0 : pi / (nn - 1)) * plotW;
					var d = Math.abs(px - mx);
					if (d < bd) { bd = d; best = pi; }
				}
				if (best < 0) return;
				// 判断是否在绘图区(避免贴边也触发)
				var topR = 26, bottomR = 22;
				var hR = (_cv.height / _scale) - topR - bottomR;
				if (mx < 30 || mx > 30 + plotW || my < topR || my > topR + hR) return;
				// 重绘 + 画 tooltip
				drawTendencyChart(_agent, _cv, opts);
				var px = 30 + (nn === 1 ? 0 : best / (nn - 1)) * plotW;
				var toolLines = [];
				var pt = String(_hist[best].t || "");
				toolLines.push(pt.slice(9) || pt);
				var goalArr = Object.keys(_colors);
				for (var tg = 0; tg < goalArr.length; tg++) {
					var tgGoal = goalArr[tg];
					var tv = _hist[best].v[tgGoal];
					if (tv !== undefined) toolLines.push(tgGoal + ": " + Math.round(tv * 1000) / 10 + "%");
				}
				// 该时刻是否有干预
				for (var ivj = 0; ivj < _ivs.length; ivj++) {
					if (String(_ivs[ivj].sim_time) === pt) { toolLines.push("▲ 干预时刻"); break; }
				}
				// 绘制 tooltip 白底框
				var tctx = _cv.getContext("2d");
				tctx.font = "10px sans-serif";
				var boxW = 0;
				for (var tl = 0; tl < toolLines.length; tl++) {
					var tw2 = tctx.measureText(toolLines[tl]).width;
					if (tw2 > boxW) boxW = tw2;
				}
				boxW += 12;
				var boxH = toolLines.length * 13 + 8;
				var bx2 = Math.min(px + 12, 30 + plotW - boxW - 2);
				if (bx2 < 4) bx2 = 4;
				var by2 = Math.max(4, my - boxH - 6);
				tctx.fillStyle = "rgba(255,255,255,0.95)";
				tctx.strokeStyle = "rgba(0,0,0,0.25)";
				tctx.lineWidth = 1;
				tctx.fillRect(bx2, by2, boxW, boxH);
				tctx.strokeRect(bx2, by2, boxW, boxH);
				tctx.fillStyle = "#333";
				for (var tl2 = 0; tl2 < toolLines.length; tl2++) {
					tctx.fillText(toolLines[tl2], bx2 + 6, by2 + 12 + tl2 * 13);
				}
				// 时间轴上的定位圆点
				tctx.fillStyle = "#e07b39";
				tctx.beginPath(); tctx.arc(px, my, 3.5, 0, Math.PI * 2); tctx.fill();
			});
			cv.addEventListener("mouseleave", function () {
				drawTendencyChart(_agent, _cv, opts);
			});
		}
	}

	function updateTendencyLegend(agentName) {
		var leg = document.querySelector('[data-tend-legend-for="' + agentName + '"]');
		if (!leg) return;
		var colors = tendencyGoalColors(agentName);
		var names = Object.keys(colors);
		if (names.length === 0) { leg.innerHTML = ""; return; }
		var parts = [];
		for (var i = 0; i < names.length; i++) {
			parts.push('<span style="color:' + colors[names[i]] + ';">■</span> ' + goalsEscape(names[i]));
		}
		parts.push('<span style="color:#999;">┅</span> 约束期望');
		leg.innerHTML = parts.join("　");
	}

	// 导出倾向曲线 PNG:后端 matplotlib 渲染(含完整历史 + 分段约束阶梯 + 干预竖线)
	// 数据源=checkpoints(刷新不丢历史),替代前端 canvas 导出(布局/裁剪问题)
	function exportTendencyChart(agentName) {
		var a = document.createElement("a");
		a.href = "/api/export-chart?agent=" + encodeURIComponent(agentName);
		a.download = "倾向演变_" + agentName + ".png";
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
	}

	// 倾向成因解释面板:构成分解 + 窗口明细 + 干预因果链(可解释性)
	function renderExplainPanel(agentName, panelEl) {
		panelEl.innerHTML = '<div style="color:#888;">加载解释数据…</div>';
		fetch("/api/explain?agent=" + encodeURIComponent(agentName)).then(function(r) { return r.json(); }).then(function(d) {
			if (!d.ok) { panelEl.innerHTML = '<div style="color:#a00;">' + goalsEscape((d.errors || []).join("; ")) + '</div>'; return; }
			var h = "";
			// ① 构成分解:倾向 = α×底色 + (1-α)×体验
			h += '<div style="font-weight:bold; color:#2d6cdf; margin-bottom:2px;">① 倾向构成分解(为什么是这个值)</div>';
			h += '<div style="color:#666; margin-bottom:3px;">倾向 = α×人物底色 + (1-α)×体验窗口均值 · α=' + d.alpha + '(累计体验 ' + d.experience_count + ' 次,窗口 ' + d.window_size + ' 条)</div>';
			var goals = d.constraints || {};
			var gnames = Object.keys(goals);
			for (var i = 0; i < gnames.length; i++) {
				var g = gnames[i];
				var dec = d.decomposition[g];
				if (!dec) continue;
				var color = TEND_COLORS[i % TEND_COLORS.length];
				h += '<div style="display:flex; align-items:center; gap:5px; margin:2px 0; flex-wrap:wrap;">';
				h += '<span style="flex:0 0 110px; color:#555;" title="' + goalsEscape(g) + '"><span style="color:' + color + ';">■</span> ' + goalsEscape(g) + '</span>';
				h += '<span style="color:#333; font-weight:bold;">' + Math.round(dec.tendency * 1000) / 10 + '%</span>';
				h += '<span style="color:#999;">= 底色 ' + Math.round(dec.base_component * 1000) / 10 + '% (α×' + Math.round(dec.base_value * 1000) / 10 + '%) + 体验 ' + Math.round(dec.experience_component * 1000) / 10 + '% ((1-α)×窗口均值 ' + Math.round(dec.window_mean * 1000) / 10 + '%)</span>';
				h += '</div>';
			}
			// ② 窗口明细:最近体验(行动 → 对齐度 → 反馈)
			h += '<div style="font-weight:bold; color:#2d6cdf; margin:8px 0 2px;">② 体验窗口明细(最近 ' + d.window_details.length + ' 条,从早到晚)</div>';
			if (d.window_details.length === 0) {
				h += '<div style="color:#999;">暂无体验记录(模拟刚开始或该角色无行动)。</div>';
			} else {
				h += '<div style="overflow-x:auto;"><table style="border-collapse:collapse; width:100%; font-size:9px;">';
				h += '<tr style="color:#888;"><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">模拟时间</th><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">行动</th>';
				var gnames2 = Object.keys(goals);
				for (var j = 0; j < gnames2.length; j++) {
					h += '<th style="padding:2px 4px; border-bottom:1px solid #ddd;">' + goalsEscape(gnames2[j]) + ' 反馈</th>';
				}
				h += '</tr>';
				for (var k = 0; k < d.window_details.length; k++) {
					var w = d.window_details[k];
					var wtime = w.time ? w.time.replace(/^(\d{4})(\d{2})(\d{2})-/, "$1-$2-$3 ") : "–";
					h += '<tr><td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#888; white-space:nowrap;">' + goalsEscape(wtime) + '</td>';
					h += '<td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#444; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + goalsEscape(w.action) + '">' + goalsEscape(w.action || "(无行动描述)") + '</td>';
					for (var jj = 0; jj < gnames2.length; jj++) {
						var fb = w.feedback[gnames2[jj]];
						h += '<td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; text-align:center; color:' + (fb !== undefined && fb > 0.1 ? "#2f9e44" : "#999") + ';">' + (fb !== undefined ? Math.round(fb * 1000) / 10 + '%' : "–") + '</td>';
					}
					h += '</tr>';
				}
				h += '</table></div>';
				h += '<div style="color:#999; margin-top:2px;">反馈 = 行动与目标语义对齐度(相对占比)× 约束权重;绿色为强反馈。</div>';
			}
			// ③ 干预因果链:干预 → 约束跳变 → 倾向滞后收敛
			h += '<div style="font-weight:bold; color:#2d6cdf; margin:8px 0 2px;">③ 干预因果链(价值可被人为改变的证据)</div>';
			if (!d.intervention_chain || d.intervention_chain.length === 0) {
				h += '<div style="color:#999;">该角色暂无干预记录。</div>';
			} else {
				h += '<table style="border-collapse:collapse; width:100%; font-size:9px;"><tr style="color:#888;"><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">模拟时间</th><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">干预</th><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">干预前倾向</th><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">干预后 2h 倾向</th><th style="text-align:left; padding:2px 4px; border-bottom:1px solid #ddd;">迁移量</th></tr>';
				for (var m = 0; m < d.intervention_chain.length; m++) {
					var iv = d.intervention_chain[m];
					var ivt = iv.sim_time || "";
					var ivNew = [];
					for (var n in iv.new_constraints) ivNew.push(n + " " + Math.round(iv.new_constraints[n] * 100) + "%");
					var ivBefore = [], ivAfter = [], ivShift = [];
					for (var nn in iv.tendency_before) ivBefore.push(nn + " " + Math.round(iv.tendency_before[nn] * 1000) / 10 + "%");
					for (var nn2 in iv.tendency_after_2h) ivAfter.push(nn2 + " " + Math.round(iv.tendency_after_2h[nn2] * 1000) / 10 + "%");
					for (var nn3 in iv.tendency_shift_2h) {
						var sv = iv.tendency_shift_2h[nn3];
						ivShift.push(nn3 + " " + (sv >= 0 ? "+" : "") + Math.round(sv * 1000) / 10 + "pp");
					}
					h += '<tr><td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#555;">' + goalsEscape(ivt) + '</td>';
					h += '<td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#2d6cdf;">' + goalsEscape(ivNew.join(", ")) + '</td>';
					h += '<td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#888;">' + goalsEscape(ivBefore.join(", ")) + '</td>';
					h += '<td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#333;">' + goalsEscape(ivAfter.join(", ")) + '</td>';
					h += '<td style="padding:2px 4px; border-bottom:1px solid #f0f0f0; color:#e07b39;">' + goalsEscape(ivShift.join(", ")) + '</td></tr>';
				}
				h += '</table>';
				h += '<div style="color:#999; margin-top:2px;">迁移量 = 干预后 2 小时倾向 − 干预前倾向(内化滞后收敛的量化证据)。</div>';
			}
			panelEl.innerHTML = h;
		}).catch(function() { panelEl.innerHTML = '<div style="color:#a00;">解释数据加载失败。</div>'; });
	}

	// =============== 干预时间轴(底部横条 / /embed/timeline) ===============
	var TIMELINE_COLORS = ["#2d6cdf", "#e07b39", "#2f9e44", "#e8590c", "#7048e8", "#0c8599", "#c2255c"];
	var TIMELINE_AGENT_COLOR = {};

	function timelineAgentColor(agent) {
		if (!TIMELINE_AGENT_COLOR[agent]) {
			var keys = Object.keys(TIMELINE_AGENT_COLOR);
			TIMELINE_AGENT_COLOR[agent] = TIMELINE_COLORS[keys.length % TIMELINE_COLORS.length];
		}
		return TIMELINE_AGENT_COLOR[agent];
	}

	function tlParse(t) {
		// "20250213-09:30" → Date(本地时间,仅用于排序/刻度)
		var m = /^(\d{4})(\d{2})(\d{2})-(\d{2}):(\d{2})$/.exec(String(t || ""));
		if (!m) return null;
		return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
	}

	function tlFmtHM(t) { // Date → "09:30"
		var p = function(n) { return (n < 10 ? "0" : "") + n; };
		return p(t.getHours()) + ":" + p(t.getMinutes());
	}

	function tlLoadTimeline() {
		var body = document.getElementById("timeline-body");
		if (!body) return;
		fetch("/api/timeline").then(function(r) { return r.json(); }).then(function(d) {
			if (!d.ok) { body.innerHTML = '<div style="color:#a00;">' + goalsEscape((d.errors || []).join("; ")) + '</div>'; return; }
			timelineEvents = d.events || [];
			timelineRender(body, d.start_time || "", d.cur_sim_time || "");
		}).catch(function() { body.innerHTML = '<div style="color:#a00;">时间轴加载失败。</div>'; });
	}

	function tlFmtMD(t) { // Date → "02/13"
		var p = function(n) { return (n < 10 ? "0" : "") + n; };
		return p(t.getMonth() + 1) + "/" + p(t.getDate());
	}

	function timelineRender(body, simStartTime, curSimTime) {
		var evs = timelineEvents.filter(function(e) { return e.sim_time; });
		var now = tlParse(curSimTime);
		// 横轴范围:模拟开始 → 当前(无事件也画空轴,展示"进程";start 缺失回退最早事件)
		var evTimes = evs.map(function(e) { return tlParse(e.sim_time); }).filter(Boolean);
		var st = tlParse(simStartTime);
		var tMin = st && (!evTimes.length || st.getTime() < Math.min.apply(null, evTimes.map(function(d) { return d.getTime(); })))
			? st
			: (evTimes.length ? new Date(Math.min.apply(null, evTimes.map(function(d) { return d.getTime(); }))) : null);
		if (!tMin) {
			body.innerHTML = '<div style="color:#999;">暂无干预记录——专家调整右侧治理约束后,干预将出现在时间轴上。</div>';
			return;
		}
		var tMax = now && now.getTime() > tMin.getTime() ? now : new Date(Math.max(tMin.getTime(), (evTimes.length ? Math.max.apply(null, evTimes.map(function(d) { return d.getTime(); })) : tMin.getTime())));
		if (tMax.getTime() === tMin.getTime()) tMax = new Date(tMin.getTime() + 60 * 60000);
		var spanMs = tMax.getTime() - tMin.getTime();
		var padL = 14, padR = 70; // 右端给"现在"标记留位
		// 宽度自适应:内容区每 30 分钟至少 46px(跨度长时舒展可横向滚动;短时下限 1150)
		var halfHours = Math.max(1, Math.round(spanMs / (30 * 60000)));
		var W = Math.max(1150, halfHours * 46 + padL + padR);
		var innerW = W - padL - padR;
		var xOf = function(d) { return padL + (d.getTime() - tMin.getTime()) / spanMs * innerW; };

		// 时间槽位:按 sim_time 分组;贪心摊开保证视觉最小间距
		// (时间极近的槽位如 12:02/12:04 在长跨度下 x 差可 < 3px,须摊开防重叠)
		var groups = {};
		var order = [];
		for (var gi = 0; gi < evs.length; gi++) {
			var st = evs[gi].sim_time;
			if (!groups[st]) { groups[st] = []; order.push(st); }
			groups[st].push(gi);
		}
		var MIN_SLOT = 16; // 相邻槽位最小像素间距
		var slotX = {};    // sim_time -> 摊开后的 x
		var prevX = -999;
		for (var oi = 0; oi < order.length; oi++) {
			var st0 = order[oi];
			var d0 = tlParse(st0);
			var rawX = d0 ? xOf(d0) : 0;
			var x = Math.max(rawX, prevX + MIN_SLOT);
			slotX[st0] = x;
			prevX = x;
		}

		// 顶部行:范围 + 角色图例 + 操作提示
		var agents = [];
		evs.forEach(function(e) { if (agents.indexOf(e.agent) < 0) agents.push(e.agent); });
		var legend = '';
		for (var ai = 0; ai < agents.length; ai++) {
			legend += '<span style="margin-right:7px;display:inline-flex;align-items:center;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + timelineAgentColor(agents[ai]) + ';margin-right:2px;"></span>' + goalsEscape(agents[ai]) + '</span>';
		}
		// 事件形态图例(独立于角色颜色)
		legend += '<span style="margin-right:7px;display:inline-flex;align-items:center;margin-left:4px;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:2px;"></span>已撤销</span>';
		legend += '<span style="display:inline-flex;align-items:center;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid #8a8a8a;background:#fff;margin-right:2px;"></span>撤销动作</span>';
		var rangeTxt = tlFmtMD(tMin) + ' ' + tlFmtHM(tMin) + ' ~ ' + tlFmtMD(tMax) + ' ' + tlFmtHM(tMax);
		var h = '<style>#timeline-body [data-tl-idx]{transition:transform .12s ease;}#timeline-body [data-tl-idx]:hover{transform:scale(1.7);z-index:9;}</style>';
		h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;">';
		h += '<div style="color:#888;font-size:10px;">共 ' + evs.length + ' 次干预 · ' + goalsEscape(rangeTxt) + '</div>';
		h += '<div>' + legend + '</div></div>';
		// 操作提示行:解释交互方式(颜色=角色,点击圆点看详情/撤销)
		h += '<div style="font-size:10px;color:#2d6cdf;background:#eef3ff;border-radius:4px;padding:3px 8px;margin-bottom:4px;">点击彩色圆点 = 查看该次干预详情(权重变化/倾向迁移/备注),详情内可撤销回滚;圆点颜色 = 该角色(见右侧图例)。</div>';

		// 轨道:事件列垂直错开堆叠;轨道更高,时间标签在上方引导线区
		h += '<div style="overflow-x:auto;padding:2px 0 4px;"><div style="position:relative;width:' + W + 'px;height:64px;">';
		// 中线
		h += '<div style="position:absolute;left:' + padL + 'px;right:' + padR + 'px;top:44px;height:2px;background:#e6e6e6;"></div>';
		// 时间标签 + 圆点(每槽位:标签在上,引导线连到中线圆点)
		var lastLabelX = -999;
		for (var oi = 0; oi < order.length; oi++) {
			var g = groups[order[oi]];
			var d0 = tlParse(order[oi]);
			if (!d0) continue;
			var gx = slotX[order[oi]];
			var N = g.length;
			var shown = Math.min(N, 4);
			var topBase = 38;  // 圆点纵向从接近中线的位置往上错开(顶部留给标签)
			var stepY = 9;
			// 时间标签:槽位间距足够才画(带小引导线指向轨道)
			if (gx - lastLabelX >= 64) {
				h += '<div style="position:absolute;left:' + (gx - 40) + 'px;top:2px;width:80px;text-align:center;font-size:10px;color:#555;pointer-events:none;">'
					+ goalsEscape(tlFmtHM(d0)) + '</div>';
				// 引导线(标签下到轨道上)
				h += '<div style="position:absolute;left:' + gx + 'px;top:15px;height:20px;width:1px;background:#d5d5d5;"></div>';
				lastLabelX = gx;
			}
			for (var k = 0; k < shown; k++) {
				var idx = g[k];
				var ev = evs[idx];
				var cy = topBase - k * stepY;
				var isUndo = ev.operator === "undo";
				var isRevoked = !!ev.revoked;
				var col = timelineAgentColor(ev.agent);
				// 同刻多条:序号标注(第 k+1/N 条),title 区分各条内容
				var seqTxt = N > 1 ? ' · 第 ' + (k + 1) + '/' + N + ' 条' : '';
				var ts = goalsEscape(ev.agent + ' ' + ev.sim_time + seqTxt);
				if (isUndo) {
					h += '<div data-tl-idx="' + idx + '" style="position:absolute;left:' + (gx - 6) + 'px;top:' + (cy - 6) + 'px;width:12px;height:12px;border-radius:50%;border:2px solid #8a8a8a;background:#fff;cursor:pointer;" title="撤销事件 ' + ts + '"></div>';
				} else if (isRevoked) {
					h += '<div data-tl-idx="' + idx + '" style="position:absolute;left:' + (gx - 6) + 'px;top:' + (cy - 6) + 'px;width:12px;height:12px;border-radius:50%;background:#bbb;border:2px solid #fff;box-shadow:0 0 0 1px #bbb;cursor:pointer;text-align:center;line-height:10px;color:#fff;font-size:9px;" title="已撤销: ' + ts + '">✕</div>';
				} else {
					h += '<div data-tl-idx="' + idx + '" style="position:absolute;left:' + (gx - 5) + 'px;top:' + (cy - 5) + 'px;width:10px;height:10px;border-radius:50%;background:' + col + ';border:2px solid #fff;box-shadow:0 0 0 1px ' + col + ';cursor:pointer;" title="' + ts + '"></div>';
				}
			}
			if (N > shown) {
				h += '<div data-tl-idx="' + g[shown] + '" style="position:absolute;left:' + (gx - 8) + 'px;top:' + (topBase - shown * stepY - 7) + 'px;min-width:16px;height:14px;border-radius:7px;background:#555;color:#fff;font-size:8px;line-height:14px;text-align:center;padding:0 3px;cursor:pointer;" title="该时刻共 ' + N + ' 条干预,展示前 ' + shown + ' 条">+' + (N - shown) + '</div>';
			}
		}
		// 当前时间标记(右端)
		var nx = padL + innerW;
		h += '<div style="position:absolute;left:' + nx + 'px;top:26px;text-align:left;">';
		h += '<div style="width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #c2255c;margin:2px 0 2px 2px;"></div>';
		h += '<div style="font-size:9px;color:#c2255c;font-weight:bold;white-space:nowrap;">现在<br>' + goalsEscape(tlFmtMD(tMax) + ' ' + tlFmtHM(tMax)) + '</div></div>';
		h += '</div></div>';
		// 底部刻度:按跨度自适应步长;跨天处(00:00)标日期分隔
		var stepMin = spanMs <= 9 * 3600000 ? 60 : (spanMs <= 18 * 3600000 ? 120 : 240);
		h += '<div style="position:relative;height:16px;margin-top:2px;overflow:hidden;"><div style="position:relative;width:' + W + 'px;">';
		var cur = new Date(Math.floor(tMin.getTime() / (stepMin * 60000)) * stepMin * 60000);
		var lastMD = "";
		while (cur.getTime() <= tMax.getTime()) {
			if (cur.getTime() >= tMin.getTime() - 60000) {
				var tx = xOf(cur);
				var md = tlFmtMD(cur);
				var label = tlFmtHM(cur);
				var isDayStart = cur.getHours() === 0 && cur.getMinutes() === 0;
				if (isDayStart || md !== lastMD || tx - xOf(tMin) > 40) {
					h += '<div style="position:absolute;left:' + tx + 'px;top:0;transform:translateX(-50%);font-size:8px;color:#999;white-space:nowrap;">'
						+ (isDayStart ? '<span style="color:#c2255c;font-weight:bold;">' + goalsEscape(md) + '</span> ' : (md !== lastMD ? goalsEscape(md) + ' ' : ''))
						+ goalsEscape(label) + '</div>';
				}
				if (md !== lastMD) lastMD = md;
			}
			cur = new Date(cur.getTime() + stepMin * 60000);
		}
		h += '</div></div>';
		body.innerHTML = h;
	}

	// 圆点点击 → 详情浮层(事件委托在 timeline-body 上)
	function timelineBind(body) {
		if (body._tlBound) return;
		body._tlBound = true;
		body.addEventListener("click", function(e) {
			var t = e.target;
			var idxEl = t && t.closest ? t.closest("[data-tl-idx]") : null;
			if (idxEl) {
				var idx = parseInt(idxEl.getAttribute("data-tl-idx"), 10);
				var ev = timelineEvents.filter(function(x) { return x.sim_time; })[idx];
				if (ev) tlShowDetail(ev, e);
				return;
			}
			// 撤销按钮(详情浮层内,事件冒泡到 body——改用 document 级关闭,这里处理按钮)
			var ub = t && t.closest ? t.closest("[data-tl-undo]") : null;
			if (ub) {
				tlUndo(ub.getAttribute("data-tl-undo"), ub.getAttribute("data-tl-undo-time"));
				return;
			}
			var cb = t && t.closest ? t.closest("[data-tl-close]") : null;
			if (cb) tlHideDetail();
		});
	}

	function tlHideDetail() {
		var d = document.getElementById("timeline-detail");
		if (d) d.style.display = "none";
	}

	function tlShowDetail(ev, evt) {
		var d = document.getElementById("timeline-detail");
		if (!d) return;
		var rows = [];
		var allGoals = {};
		for (var g in ev.old_constraints) allGoals[g] = 1;
		for (var g2 in ev.new_constraints) allGoals[g2] = 1;
		for (var g3 in allGoals) {
			var o = ev.old_constraints[g3];
			var n = ev.new_constraints[g3];
			var mark = "";
			if (o !== undefined && n !== undefined) {
				var diff = Math.round((n - o) * 1000) / 10;
				if (Math.abs(diff) > 0.01) mark = '<span style="color:' + (diff > 0 ? "#2f9e44" : "#e8590c") + ';">(' + (diff > 0 ? "+" : "") + diff + 'pp)</span>';
			}
			rows.push('<tr><td style="padding:1px 6px 1px 0;color:#555;">' + goalsEscape(g3) + '</td>'
				+ '<td style="padding:1px 6px;color:#888;text-align:right;">' + (o !== undefined ? Math.round(o * 1000) / 10 + "%" : "–") + '</td>'
				+ '<td style="padding:1px 6px;color:#333;text-align:right;">' + (n !== undefined ? Math.round(n * 1000) / 10 + "%" : "–") + '</td>'
				+ '<td style="padding:1px 6px;">' + mark + '</td></tr>');
		}
		var shiftRows = [];
		for (var sg in ev.tendency_shift) {
			var sv = ev.tendency_shift[sg];
			shiftRows.push('<span style="margin-right:6px;">' + goalsEscape(sg) + ' ' + (sv >= 0 ? "+" : "") + Math.round(sv * 1000) / 10 + 'pp</span>');
		}
		var isUndo = ev.operator === "undo";
		var isRevoked = !!ev.revoked;
		var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">';
		h += '<div style="font-weight:bold;color:' + (isRevoked ? "#8a8a8a" : timelineAgentColor(ev.agent)) + ';">' + goalsEscape(ev.agent) + ' · ' + goalsEscape(ev.sim_time)
			+ (isUndo ? ' · <span style="color:#8a8a8a;">撤销事件</span>'
			  : isRevoked ? ' · <span style="color:#8a8a8a;">已撤销(回滚)</span>'
			  : ' · <span style="color:#2d6cdf;">干预</span>') + '</div>';
		h += '<button data-tl-close style="border:none;background:none;cursor:pointer;color:#999;font-size:13px;line-height:1;">✕</button></div>';
		if (ev.note) h += '<div style="color:#555;margin-bottom:4px;background:#f4f6fa;padding:3px 6px;border-radius:4px;">备注:' + goalsEscape(ev.note) + '</div>';
		if (ev.real_time) h += '<div style="color:#999;font-size:10px;margin-bottom:4px;">真实操作时间:' + goalsEscape(ev.real_time) + '</div>';
		h += '<table style="border-collapse:collapse;font-size:10px;margin-bottom:4px;"><tr style="color:#888;"><th style="text-align:left;padding:1px 6px 1px 0;">目标</th><th style="text-align:right;padding:1px 6px;">干预前</th><th style="text-align:right;padding:1px 6px;">干预后</th><th></th></tr>' + rows.join("") + '</table>';
		h += '<div style="color:#555;font-size:10px;margin-bottom:2px;">干预后 2h 倾向迁移:' + (shiftRows.length ? shiftRows.join("") : '<span style="color:#999;">暂无数据</span>') + '</div>';
		if (!isUndo && !isRevoked && ev.real_time) {
			h += '<div style="margin-top:6px;text-align:right;"><button data-tl-undo="' + goalsEscape(ev.agent) + '" data-tl-undo-time="' + goalsEscape(ev.real_time) + '" style="padding:3px 10px;font-size:10px;border:1px solid #e8590c;border-radius:4px;background:#fff7f4;color:#e8590c;cursor:pointer;">撤销此干预(回滚)</button></div>';
		}
		d.innerHTML = h;
		d.style.display = "block";
		// 定位:点击点附近(靠下显示),防溢出视口
		var px = evt && evt.clientX ? evt.clientX : 200;
		var py = evt && evt.clientY ? evt.clientY : 120;
		var vw = window.innerWidth || 1200;
		var left = Math.min(px, vw - 450);
		d.style.left = Math.max(8, left) + "px";
		d.style.top = Math.max(8, py - 90) + "px";
	}

	function tlUndo(agent, realTime) {
		// 需要匹配:agent + sim_time + time。sim_time 从当前事件缓存按 real_time 找
		var ev = null;
		for (var i = 0; i < timelineEvents.length; i++) {
			if (timelineEvents[i].agent === agent && timelineEvents[i].real_time === realTime
				&& timelineEvents[i].operator !== "undo" && !timelineEvents[i].revoked) { ev = timelineEvents[i]; break; }
		}
		if (!ev) { alert("找不到对应干预记录"); return; }
		if (!confirm("确定撤销 " + agent + " 于 " + ev.sim_time + " 的干预?约束将回滚到干预前状态,并记录一条撤销审计。")) return;
		fetch("/api/undo-intervention", {
			method: "POST",
			headers: {"Content-Type": "application/json"},
			body: JSON.stringify({agent: agent, sim_time: ev.sim_time, time: realTime})
		}).then(function(r) { return r.json(); }).then(function(out) {
			if (out.ok) {
				tlHideDetail();
				timelineRefresh();
				// 治理面板约束已变:重新拉取(滑条/曲线/约束对照同步)
				if (document.getElementById("goals-body")) {
					fetch("/api/goals").then(function(r) { return r.json(); }).then(function(g) {
						if (g.ok) { goalsData = g.goals; tendencyData = g.tendency || {}; roleTypes = g.role_types || {}; goalsRender(); }
					}).catch(function() {});
				}
				devLog("ok", "已撤销干预:" + agent + " @" + ev.sim_time);
			} else {
				alert((out.errors || ["撤销失败"]).join("; "));
			}
		}).catch(function(e) { alert("撤销请求失败:" + e); });
	}

	function timelineRefresh() {
		if (document.getElementById("timeline-body")) tlLoadTimeline();
	}
	// 时间轴轮询:5s 拉一次(干预少,轻量;新干预自动出现)
	function timelinePollStart() {
		if (timelineTimer) return;
		timelineRefresh();
		timelineTimer = setInterval(timelineRefresh, 5000);
	}

	// 时间轴显示模式:全页为 fixed 底部横条;timeline 嵌入为普通流式面板(无折叠头)
	function timelineInit() {
		var body = document.getElementById("timeline-body");
		if (!body) return;
		timelineBind(body);
		// 详情浮层独立于 timeline-body,需 document 级委托(撤销/关闭按钮)
		document.addEventListener("click", function(e) {
			var t = e.target;
			if (!t || !t.closest) return;
			var ub = t.closest("[data-tl-undo]");
			if (ub) {
				e.stopPropagation();
				tlUndo(ub.getAttribute("data-tl-undo"), ub.getAttribute("data-tl-undo-time"));
				return;
			}
			var cb = t.closest("[data-tl-close]");
			if (cb) { e.stopPropagation(); tlHideDetail(); return; }
			// 点击浮层外部关闭(排除时间轴面板内部:点圆点切换详情不应先关浮层)
			var det = document.getElementById("timeline-detail");
			if (det && det.style.display !== "none" && !det.contains(t)) {
				var inPanel = !!t.closest("#timeline-panel, [data-tl-idx]");
				if (!inPanel) tlHideDetail();
			}
		});
		var embedMode = document.body.getAttribute("data-embed") || "";
		// 折叠(全页与 timeline 嵌入页统一):收起只留头部,展开恢复内容
		var header = document.getElementById("timeline-header");
		var toggle = document.getElementById("timeline-toggle");
		var panel = document.getElementById("timeline-panel");
		var body2 = document.getElementById("timeline-body");
		if (header && panel) {
			// 嵌入页面板有 min-height,折叠需同时清掉(否则 body 隐藏后仍占高)
			if (embedMode === "timeline") {
				panel.style.minHeight = "340px";
				body2.style.display = "block";
			}
			header.onclick = function() {
				var isCollapsed = body2.style.display === "none";
				body2.style.display = isCollapsed ? "block" : "none";
				if (toggle) toggle.textContent = isCollapsed ? "收起 ▾" : "展开 ▸";
				if (embedMode === "timeline") {
					panel.style.minHeight = isCollapsed ? "0px" : "340px";
				} else {
					panel.style.maxHeight = isCollapsed ? "none" : "40px";
					// 右列底距联动:展开时给时间轴让位,收起后收回(否则留大空白)
					var rc = document.getElementById("right-col");
					if (rc) rc.style.bottom = isCollapsed ? "16px" : "210px";
				}
				if (isCollapsed) timelinePollStart();
			};
			toggle.textContent = "收起 ▾";
		}
		if (embedMode === "timeline") {
			// 独立嵌入页:面板高度由内容撑开,横向滚动条由 timeline-body 内部处理
			timelinePollStart();
			return;
		}
		timelinePollStart();
	}
	timelineInit();

	document.addEventListener("DOMContentLoaded", function() {
		// chat log collapse toggle
		var ch = document.getElementById("chat-header");
		var ct = document.getElementById("chat-toggle");
		if (ch && ct) ch.onclick = function() {
			var body = document.getElementById("chat-content");
			if (body.style.display === "none") { body.style.display = "block"; ct.textContent = "Collapse ▾"; }
			else { body.style.display = "none"; ct.textContent = "Expand ▸"; }
		};
		// collapse toggle(治理约束面板)
		var gh = document.getElementById("goals-header");
		var gt = document.getElementById("goals-toggle");
		var gPanel = document.getElementById("goals-panel");
		if (gh && gt) gh.onclick = function() {
			var body = document.getElementById("goals-body");
			if (body.style.display === "none") {
				body.style.display = "block";
				gt.textContent = "Collapse ▾";
				if (gPanel) gPanel.style.flex = "1 1 auto"; // 展开:占满容器剩余
			} else {
				body.style.display = "none";
				gt.textContent = "Expand ▸";
				if (gPanel) gPanel.style.flex = "0 0 auto"; // 收起:面板收缩到仅头部
			}
		};
		// load governance constraints + value tendency + interventions
		fetch("/api/goals").then(function(r) { return r.json(); }).then(function(out) {
			if (out.ok && out.goals) {
				goalsData = out.goals;
				tendencyData = out.tendency || {};
				interventionsData = out.interventions || [];
				roleTypes = out.role_types || {};
				goalsRender();
			}
		}).catch(function() {});
		// event delegation on goals-body
		var body = document.getElementById("goals-body");
		if (!body) return;
		// 拖动过程只更新本地显示(不提交);松开(change)才提交——避免拖动过程产生大量干预记录
		// 注意:input 时不能 goalsRender()——重建面板会销毁滑条元素,导致 change 事件永不触发
		body.addEventListener("input", function(e) {
			if (e.target && e.target.tagName === "INPUT" && e.target.type === "range") {
				var a = e.target.getAttribute("data-agent");
				var g = e.target.getAttribute("data-goal");
				if (a && g && goalsData[a]) {
					goalsData[a][g] = parseInt(e.target.value, 10) / 100;
					goalsNormalize(a);
					// 只更新权重数字与条宽,不重建面板(保住滑条元素让 change 能触发)
					var wEl = body.querySelector('[data-weight-for="' + g + '"]');
					if (wEl) wEl.textContent = Math.round(goalsData[a][g] * 100) + '%';
					updateTendencyBars(a);
				}
			}
		});
		body.addEventListener("change", function(e) {
			if (e.target && e.target.tagName === "INPUT" && e.target.type === "range") {
				var a = e.target.getAttribute("data-agent");
				var g = e.target.getAttribute("data-goal");
				if (a && g && goalsData[a]) {
					goalsData[a][g] = parseInt(e.target.value, 10) / 100;
					goalsNormalize(a);
					goalsPush(a);
				}
			}
		});
		body.addEventListener("click", function(e) {
			var t = e.target;
			// 导出曲线图片
			if (t && t.getAttribute && t.getAttribute("data-export-chart-for") !== null) {
				exportTendencyChart(t.getAttribute("data-export-chart-for"));
				return;
			}
			// 解释倾向成因(可解释性面板)
			if (t && t.getAttribute && t.getAttribute("data-explain-for") !== null) {
				var ea = t.getAttribute("data-explain-for");
				var panel = body.querySelector('[data-explain-panel-for="' + ea + '"]');
				if (panel) {
					var vis = panel.style.display !== "none";
					panel.style.display = vis ? "none" : "block";
					if (!vis) renderExplainPanel(ea, panel);
				}
				return;
			}
			// 角色切换
			if (t && t.getAttribute && t.getAttribute("data-agent-tab") !== null) {
				selectedAgent = t.getAttribute("data-agent-tab");
				goalsRender();
				return;
			}
			// add goal
			if (t && t.getAttribute && t.getAttribute("data-add-goal") !== null) {
				var a = t.getAttribute("data-add-goal");
				var input = body.querySelector('[data-new-goal="' + a + '"]');
				var name = input ? input.value.trim() : "";
				if (!name || /^\d/.test(name)) return;  // 空名/数字开头 = 误输入,丢弃
				if (!goalsData[a]) goalsData[a] = {};
				// 新目标给极小非零权重:goalsPush 会过滤 0 权重项(防拖动垃圾),
				// 但添加是明确操作必须提交,0 会被后端清洗丢弃 → 前后端不一致
				goalsData[a][name] = 0.001;
				goalsPush(a);
			}
			// delete goal
			if (t && t.getAttribute && t.getAttribute("data-del-goal") !== null) {
				var a2 = t.getAttribute("data-del-agent");
				var g2 = t.getAttribute("data-del-goal");
				if (a2 && g2 && goalsData[a2]) {
					delete goalsData[a2][g2];
					goalsPush(a2);
				}
			}
		});
	});
</script>
