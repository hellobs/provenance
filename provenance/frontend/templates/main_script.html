<script type="text/javascript">
	// Initialize variables from Flask context
	let step = {{ step|tojson }};
	let step_size = {{ sec_per_step|tojson }} * 1000; // Convert to milliseconds
	let zoom = {{ zoom|tojson }};
	// Canvas is fixed to the map size (27x24 tiles = 864x768); scene shown 1:1;
	// zoom<=0 defaults to 1 (URL ?zoom= scales the canvas)
	if (zoom <= 0) zoom = 1;

	let tile_width = 32;
	let movement_speed = {{ play_speed|tojson }} * 0.5;   // replay-mode movement speed
	let execute_count_max = tile_width / movement_speed;
	let execute_count = execute_count_max;
	let all_movement = {{ all_movement|tojson }};

	// Live mode (direct-drive mode): move agent smoothly on each agent message
	let live_mode = {{ live_mode|default(false)|tojson }};
	let FRONTEND_VERSION = "v10-path";   // frontend version (cache-busting)
	let move_speed = 1.0;             // pixels/frame (60fps) ≈ 1.9 tiles/s, walking feel
	let movement_target = {};         // agent -> waypoint queue (pixels)
	let sim_finished = false;
	let sim_error = "";
	let display_time = null;          // currently displayed time (Date)
	let target_time = null;           // target time (pushed by simulation) Date
	let shown_chats = {};             // chat time keys already shown (dedup)

	// Append dialogue lines (speaker highlighted, auto-scroll)
	function appendChatLine(speaker, text) {
		let el = document.getElementById("chat-content");
		if (!el) return;
		el.innerHTML += `<div style="margin:2px 0;"><span style="font-weight:bold; color:#2d6cdf;">${speaker}</span>：${text}</div>`;
		el.scrollTop = el.scrollHeight;
	}

	// Render dialogue into the HTML panel (scrollable, speaker highlighted, auto-scroll)
	function appendChat(t, text) {
		if (shown_chats[t]) return;
		shown_chats[t] = true;
		let el = document.getElementById("chat-content");
		if (!el) return;
		let html = `<div style="margin-top:8px; color:#999; font-size:12px;">${t}</div>`;
		let lines = String(text).split("\n");
		for (let line of lines) {
			line = line.trim();
			if (!line) continue;
			if (line.startsWith("Location:")) {
				html += `<div style="color:#aaa; font-size:12px; margin:2px 0;">${line.slice(9)}</div>`;
			} else {
				let idx = line.indexOf(": ");
				if (idx > 0) {
					let speaker = line.slice(0, idx);
					let content = line.slice(idx + 2);
					html += `<div style="margin:3px 0;"><span style="font-weight:bold; color:#2d6cdf;">${speaker}</span>: ${content}</div>`;
				} else {
					html += `<div style="margin:3px 0;">${line}</div>`;
				}
			}
		}
		el.innerHTML += html;
		el.scrollTop = el.scrollHeight;
	}

	let datetime_options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
	let start_datetime = new Date(Date.parse({{ start_datetime|tojson }}));

	// Persona related variables
	let persona_names = {{ persona_init_pos|tojson }};
	var spawn_tile_loc = {};
	for (var key in persona_names) {
		spawn_tile_loc[key] = persona_names[key];
	}

	var personas = {};
	var pronunciatios = {};
	let anims_direction;
	let pre_anims_direction;
	let pre_anims_direction_dict = {};

	let finished = false;
	let paused = false;

	// Phaser configuration
	// embed 模式(scene 嵌入 iframe):自适应容器尺寸;独立页面:固定 864x768
	const embedMode = document.body.getAttribute("data-embed") || "";
	// 仅独立页面与 scene 嵌入模式创建场景;goals/explain 是纯面板页,
	// 不加载场景(避免 iframe 里多个 Phaser 实例互相干扰/初始化失败,
	// 也避免 Phaser 脚本加载失败时中断面板脚本)
	const wantScene = !embedMode || embedMode === "scene";
	let game = null;
	if (wantScene) {
		// 独立页面:固定 864x768(与原版一致,场景居中);
		// scene 嵌入模式:自适应 iframe 容器尺寸
		const isEmbedScene = embedMode === "scene";
		const gameWidth = isEmbedScene
			? Math.max(320, (document.getElementById("game-container") || {}).clientWidth || 864)
			: 864;
		const gameHeight = isEmbedScene
			? Math.max(240, window.innerHeight || 768)
			: 768;
		const config = {
			type: Phaser.AUTO,
			backgroundColor: "#e8e8e8",
			width: gameWidth,
			height: gameHeight,
			parent: "game-container",
			mode: Phaser.Scale.NONE,
			pixelArt: true,
			physics: {
				default: "arcade",
				arcade: {
					gravity: { y: 0 }
				}
			},
			scene: {
				preload: preload,
				create: create,
				update: update
			},
			scale: {
				zoom: zoom
			}
		};
		game = new Phaser.Game(config);
	}
	let cursors;
	let player;

	// ================= Developer Console =================
	// Log a message to the console panel (timestamped, colored by category)
	function devLog(cat, text) {
		var body = document.getElementById("dev-console-body");
		if (!body) return;
		var now = new Date();
		var ts = ("0" + now.getHours()).slice(-2) + ":" + ("0" + now.getMinutes()).slice(-2) + ":" + ("0" + now.getSeconds()).slice(-2);
		var color = "#ccc";
		if (cat === "agent") color = "#6cf";
		else if (cat === "ai") color = "#c6f";
		else if (cat === "chat") color = "#fc6";
		else if (cat === "time") color = "#6f6";
		else if (cat === "event") color = "#f66";
		else if (cat === "error") color = "#f44";
		else if (cat === "sys") color = "#888";
		var div = document.createElement("div");
		div.innerHTML = "<span style='color:#888;'>[" + ts + "]</span> <span style='color:" + color + ";'>" + cat + "</span> " + text;
		body.appendChild(div);
		// Keep at most 300 lines, drop the oldest
		while (body.children.length > 300) body.removeChild(body.firstChild);
		body.scrollTop = body.scrollHeight;
	}
	// Console collapse/expand
	function devToggle() {
		var body = document.getElementById("dev-console-body");
		var t = document.getElementById("dev-console-toggle");
		if (body.style.display === "none") {
			body.style.display = "block";
			t.innerHTML = "Collapse ▾";
		} else {
			body.style.display = "none";
			t.innerHTML = "Expand ▸";
		}
	}
	// ================= Global error capture (into console) =================
	// 1) JS runtime errors
	window.onerror = function(msg, src, line, col, err) {
		devLog("error", "JS error: " + msg + " (" + (src || "").split("/").pop() + ":" + line + ":" + col + ")");
		return false;  // do not prevent default behavior
	};
	// 2) Unhandled promise rejections
	window.addEventListener("unhandledrejection", function(e) {
		var reason = e.reason;
		var text = reason && reason.message ? reason.message : String(reason);
		devLog("error", "Promise rejection: " + text);
	});
	// 3) Backend error messages are handled in ws.onmessage (devLog event)
	document.addEventListener("DOMContentLoaded", function() {
		var h = document.getElementById("dev-console-header");
		if (h) h.onclick = devToggle;
	});

	// Live mode: receive simulation pushes over WebSocket, drive agent movement directly (protocol in framework/runtime/protocol.py)
	if (live_mode) {
		let sse_state = "connecting";
		let lastMsgTs = Date.now();  // 最后收到消息的时间(服务端每 5 秒发心跳)
		let ws = new WebSocket("ws://" + location.host + "/ws");
		ws.onopen = function() { sse_state = "connected"; devLog("sys", "WebSocket connected"); };
		ws.onclose = function() { sse_state = "error"; devLog("sys", "WebSocket closed, reconnecting in 3s"); setTimeout(function() { location.reload(); }, 3000); };
		ws.onerror = function() { sse_state = "error"; devLog("sys", "WebSocket error"); };
		// (WebSocket disconnect is handled by onclose: reload page after 3s to reconnect)
		ws.onmessage = function(e) {
			lastMsgTs = Date.now();  // 任意消息(含心跳)都视为连接健康
			const msg = JSON.parse(e.data);
			if (msg.type === "agent") {
				var isAI = msg.role_type === "ai_tool";
				// 场景驱动仅在 scene/独立页执行;面板模式只消费倾向数据
				if (wantScene) {
					devLog(isAI ? "ai" : "agent", (isAI ? "[AI] " : "") + msg.name + " → " + (msg.action || "").slice(0, 30) + " @ " + JSON.stringify(msg.coord));
					moveAgent(msg.name, msg.coord, msg.action, msg.location, msg.currently, msg.path);
				}
				// 记录角色类型(AI 工具 vs 人,面板徽标用)
				if (msg.role_type) roleTypes[msg.name] = msg.role_type;
				// IVD 核心观测:记录价值倾向演变(按模拟时间去重,阶梯=行动变化点)
				if (msg.value_tendency && Object.keys(msg.value_tendency).length > 0) {
					tendencyRecord(msg.name, msg.time || "", msg.value_tendency);
				}
				if (msg.conversation && wantScene) {
					Object.assign(all_movement["conversation"], msg.conversation);
					// live mode: dialogues are already shown line-by-line via chat_line; do not append again
				}
				if (msg.description && wantScene) {
					for (const n in msg.description) {
						all_movement["description"][n] = msg.description[n];
					}
				}
			} else if (msg.type === "chat_line") {
				// Show dialogue lines in real time (mark AI tool roles)
				var spIsAI = (msg.speaker === "AI Advisor");
				devLog(spIsAI ? "ai" : "chat", (spIsAI ? "[AI] " : "") + msg.speaker + ": " + (msg.text || "").slice(0, 40));
				appendChatLine(msg.speaker, msg.text);
			} else if (msg.type === "time") {
				devLog("time", "Game time → " + msg.time);
				setCurrentTime(msg.time);
			} else if (msg.type === "snapshot") {
				devLog("sys", "Snapshot: " + Object.keys(msg.agents || {}).length + " agents, time " + msg.time);
				if (wantScene) applySnapshot(msg.agents, msg.time);
				else if (msg.time) setCurrentTime(msg.time);
			} else if (msg.type === "done") {
				devLog("sys", "Simulation finished");
				sim_finished = true;
			} else if (msg.type === "error") {
				devLog("event", "Error: " + (msg.message || ""));
				sim_error = msg.message || "Simulation error";
			} else if (msg.type === "story") {
				// Story event injection: highlight in console + red banner flash
				devLog("event", "【" + (msg.event_type || "event") + "】" + (msg.content || "").slice(0, 50) + " → " + (msg.targets || []).join(","));
				var banner = document.getElementById("story-banner");
				if (banner) {
					banner.innerHTML = "【" + (msg.event_type || "event") + "】" + msg.content + "<br><small style='color:#ffe0e0;'>Affects: " + (msg.targets || []).join(", ") + " @ " + (msg.time || "") + "</small>";
					banner.style.display = "block";
					// 闪烁强调(三次),然后保持显示 12 秒
					banner.style.animation = "none";
					void banner.offsetWidth;  // 重置动画
					banner.style.animation = "storyFlash 0.5s ease-in-out 3";
					setTimeout(function() { banner.style.display = "none"; }, 12000);
				}
			}
			// diagnostics: expose connection state
			window.__sse_state = sse_state;
		};

		// ---- 连接健康看门狗(失焦回来后页面卡住,不用手动刷新) ----
		// 原因:WS 半开死连接(onclose 不触发)时页面静默停在旧状态;
		// 浏览器对后台标签页节流/冻结定时器,回焦检查是唯一可靠时机。
		var wsReloads = 0, wsLastReload = 0;
		function wsDeadRecover(reason) {
			var now = Date.now();
			if (now - wsLastReload < 10000) wsReloads++; else wsReloads = 0;
			wsLastReload = now;
			if (wsReloads > 6) return;  // 服务端长时间不可用,停止循环刷新
			devLog("sys", reason + ", reloading");
			location.reload();
		}
		// 前台定时检查:超过 20 秒没有任何消息(心跳 5 秒一次,正常不会触发)→ 判定连接已死
		setInterval(function() {
			if (document.visibilityState === "hidden") return;  // 后台交给 visibilitychange
			if (Date.now() - lastMsgTs > 20000) wsDeadRecover("No data for 20s");
		}, 5000);
		// 回焦立即检查:连接不是 OPEN 就重载(浏览器冻结期间 onclose 不会触发)
		document.addEventListener("visibilitychange", function() {
			if (document.visibilityState === "visible" && ws.readyState !== WebSocket.OPEN) {
				wsDeadRecover("WebSocket not OPEN on focus return");
			}
		});
	}

	function setCurrentTime(t) {
		if (!t || t.length < 12) return;
		window.__time_count = (window.__time_count || 0) + 1;
		// Extract the "12:42" part of "20250213-12:42" directly; no Date parsing (avoids parsing bugs)
		let timeStr = String(t).slice(9);
		let clockEl = document.getElementById("sim-clock-time");
		if (clockEl) clockEl.innerHTML = timeStr;
		display_time = timeStr;
		target_time = timeStr;
	}

	function applySnapshot(agents, time) {
		for (const name in agents) {
			if (!(name in personas)) continue;
			const a = agents[name];
			personas[name].body.x = a.coord[0] * tile_width;
			personas[name].body.y = a.coord[1] * tile_width;
			let act = (a.action || "").trim();
			pronunciatios[name].setText(name + ": " + (act.length > 20 ? act.substring(0, 20) + "..." : act));
			if (document.getElementById("agent_desc__" + name)) {
				document.getElementById("current_action__" + name).innerHTML = act;
				document.getElementById("target_address__" + name).innerHTML = a.location || "";
			}
		}
		if (time) setCurrentTime(time);
	}

	function moveAgent(name, coord, action, location, currently, path) {
		if (!(name in personas)) return;
		// Move along the pathfinding route: waypoints = array of pixel points (tile by tile, no wall clipping)
		let waypoints = [];
		if (path && path.length > 0) {
			for (let p of path) {
				waypoints.push([p[0] * tile_width, p[1] * tile_width]);
			}
		} else {
			waypoints.push([coord[0] * tile_width, coord[1] * tile_width]);
		}

		// Queue movement: if this agent is still walking the old path, append the new path to the tail —
		// finish the old path first (its end = backend last_location = new path start), then walk the new path.
		// avoids "movement interrupted → realign → teleport" entirely
		let cur = movement_target[name];
		if (cur && cur.length > 0) {
			let last = cur[cur.length - 1];
			if (waypoints.length > 0 && waypoints[0][0] === last[0] && waypoints[0][1] === last[1]) {
				waypoints.shift();  // new path start == queue end, dedupe
			}
			movement_target[name] = cur.concat(waypoints);
		} else {
			movement_target[name] = waypoints;
		}

		let act = (action || "").trim();
		if (act.includes("睡觉") || act.toLowerCase().includes("sleep")) act = "Sleeping: " + act;
		pronunciatios[name].setText(name + ": " + (act.length > 20 ? act.substring(0, 20) + "..." : act));

		if (document.getElementById("agent_desc__" + name)) {
			if (currently) document.getElementById("agent_desc__" + name).innerHTML = currently;
			document.getElementById("current_action__" + name).innerHTML = act;
			document.getElementById("target_address__" + name).innerHTML = location || "";
		}
	}

	// Preload function
	function preload() {
		this.load.crossOrigin = "";

		// Load images
		this.load.image("blocks_1", "/static/assets/village/tilemap/blocks_1.png");
		this.load.image("walls", "/static/assets/village/tilemap/Room_Builder_32x32.png");
		this.load.image("interiors_pt1", "/static/assets/village/tilemap/interiors_pt1.png");
		this.load.image("interiors_pt2", "/static/assets/village/tilemap/interiors_pt2.png");
		this.load.image("interiors_pt3", "/static/assets/village/tilemap/interiors_pt3.png");
		this.load.image("interiors_pt4", "/static/assets/village/tilemap/interiors_pt4.png");
		this.load.image("interiors_pt5", "/static/assets/village/tilemap/interiors_pt5.png");
		this.load.image("CuteRPG_Field_B", "/static/assets/village/tilemap/CuteRPG_Field_B.png");
		this.load.image("CuteRPG_Field_C", "/static/assets/village/tilemap/CuteRPG_Field_C.png");
		this.load.image("CuteRPG_Harbor_C", "/static/assets/village/tilemap/CuteRPG_Harbor_C.png");
		this.load.image("CuteRPG_Village_B", "/static/assets/village/tilemap/CuteRPG_Village_B.png");
		this.load.image("CuteRPG_Forest_B", "/static/assets/village/tilemap/CuteRPG_Forest_B.png");
		this.load.image("CuteRPG_Desert_C", "/static/assets/village/tilemap/CuteRPG_Desert_C.png");
		this.load.image("CuteRPG_Mountains_B", "/static/assets/village/tilemap/CuteRPG_Mountains_B.png");
		this.load.image("CuteRPG_Desert_B", "/static/assets/village/tilemap/CuteRPG_Desert_B.png");
		this.load.image("CuteRPG_Forest_C", "/static/assets/village/tilemap/CuteRPG_Forest_C.png");

		// Load tilemap JSON
		this.load.tilemapTiledJSON("map", "/static/assets/village/tilemap/tilemap.json");

		// Load persona atlases (player/camera follows the first character's texture)
		for (var p in persona_names) {
			image_static = "/static/assets/village/agents/" + p + "/texture.png";
			this.load.atlas(p, image_static, filename="/static/assets/village/agents/sprite.json");
		}
	}

	// Create function
	function create() {
		const map = this.make.tilemap({ key: "map" });

		// Add tilesets and layers
		const collisions = map.addTilesetImage("blocks", "blocks_1");
		const walls = map.addTilesetImage("Room_Builder_32x32", "walls");
		const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
		const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
		const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
		const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
		const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
		const CuteRPG_Field_B = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
		const CuteRPG_Field_C = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
		const CuteRPG_Harbor_C = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
		const CuteRPG_Village_B = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
		const CuteRPG_Forest_B = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
		const CuteRPG_Desert_C = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
		const CuteRPG_Mountains_B = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
		const CuteRPG_Desert_B = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
		const CuteRPG_Forest_C = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");

		let tileset_group_1 = [CuteRPG_Field_B, CuteRPG_Field_C, CuteRPG_Harbor_C, CuteRPG_Village_B,
			CuteRPG_Forest_B, CuteRPG_Desert_C, CuteRPG_Mountains_B, CuteRPG_Desert_B, CuteRPG_Forest_C,
			interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt4, interiors_pt5, walls];
		const bottomGroundLayer = map.createLayer("Bottom Ground", tileset_group_1, 0, 0);
		const exteriorGroundLayer = map.createLayer("Exterior Ground", tileset_group_1, 0, 0);
		const exteriorDecorationL1Layer = map.createLayer("Exterior Decoration L1", tileset_group_1, 0, 0);
		const exteriorDecorationL2Layer = map.createLayer("Exterior Decoration L2", tileset_group_1, 0, 0);
		const interiorGroundLayer = map.createLayer("Interior Ground", tileset_group_1, 0, 0);
		const wallLayer = map.createLayer("Wall", [CuteRPG_Field_C, walls], 0, 0);
		const interiorFurnitureL1Layer = map.createLayer("Interior Furniture L1", tileset_group_1, 0, 0);
		const interiorFurnitureL2Layer = map.createLayer("Interior Furniture L2 ", tileset_group_1, 0, 0);
		const foregroundL1Layer = map.createLayer("Foreground L1", tileset_group_1, 0, 0);
		const foregroundL2Layer = map.createLayer("Foreground L2", tileset_group_1, 0, 0);

		const collisionsLayer = map.createLayer("Collisions", collisions, 0, 0);

		collisionsLayer.setCollisionByProperty({ collide: true });

		collisionsLayer.setDepth(-1);
		foregroundL1Layer.setDepth(2);
		foregroundL2Layer.setDepth(2);

		const canvas = game.canvas;
		canvas.addEventListener("wheel", (event) => {
			event.stopPropagation();
		}, { passive: false, capture: true });

		function add_text(game, x, y, text, background) {
			res = game.add.text(
				x,
				y,
				text,
				{
					font: "24px SimHei, sans-serif",
					fontWeight: "normal",
					fill: "#000000",
					backgroundColor: background,
					padding: { x: 20, y: 4},
					align: "left",
					wordWrap: { width: 1200/zoom, useAdvancedWrap: true },
				}
			);

			res.setDepth(10);
			res.alpha = 0.8;
			res.setScrollFactor(0);

			return res;
		}

		// Chat panel is always visible; run/pause/show/hide buttons removed

		// Setup camera (player follows first character; texture key = character name)
		let player_texture = Object.keys(persona_names)[0] || "atlas";
		player = this.physics.add.sprite(13 * tile_width, 11 * tile_width, player_texture, "down").setSize(30, 40).setOffset(0, 0);
		player.setDepth(-1);
		const camera = this.cameras.main;
		camera.startFollow(player);
		camera.setBounds(0, 0, map.widthInPixels, map.heightInPixels);
		// When the whole map is visible (viewport >= map size), center it fixed;
		// otherwise camera bounds clamp to top-left, shifting the view up/left
		if (camera.width >= map.widthInPixels || camera.height >= map.heightInPixels) {
			camera.stopFollow();
			camera.scrollX = (map.widthInPixels - camera.width) / 2;
			camera.scrollY = (map.heightInPixels - camera.height) / 2;
		} else {
			camera.centerOn(map.widthInPixels / 2, map.heightInPixels / 2);
		}
		cursors = this.input.keyboard.createCursorKeys();

		// Setup personas
		// We start by creating the game sprite objects.
		for (let i=0; i<Object.keys(spawn_tile_loc).length; i++) {
			let persona_name = Object.keys(spawn_tile_loc)[i];
			let start_pos = [spawn_tile_loc[persona_name][0] * tile_width + tile_width / 2, spawn_tile_loc[persona_name][1] * tile_width + tile_width];
			let new_sprite = this.physics.add.sprite(start_pos[0], start_pos[1], persona_name, "down").setSize(30, 40).setOffset(0, 0);
			// Scale up the sprite
			new_sprite.displayWidth = 40;
			new_sprite.scaleY = new_sprite.scaleX;

			// Here, we are creating the persona and its pronunciatio sprites.
			personas[persona_name] = new_sprite;
			pronunciatios[persona_name] = this.add.text(
				new_sprite.body.x - 15,
				new_sprite.body.y - 15 - 25,
				"",
				{
					font: "18px monospace",
					fill: "#000000",
					backgroundColor: "#ffffcc",
					padding: { x: 4, y: 4},
					border:"solid",
					borderRadius:"10px"
				}
			).setDepth(3);
			pronunciatios[persona_name].alpha = 0.7;

			// 角色点击:独立页 → 选中详情;嵌入模式 → postMessage 通知宿主平台
			// (宿主(如仝牧治理平台)可通过 window.addEventListener("message") 接收,
			//  事件 data = {type:"provenance.agentClick", name, time})
			new_sprite.setInteractive({ useHandCursor: true });
			new_sprite.on("pointerdown", (function (pname) {
				return function () {
					var payload = {
						type: "provenance.agentClick",
						name: pname,
						time: document.getElementById("sim-clock-time") ? document.getElementById("sim-clock-time").textContent : ""
					};
					if (embedMode) {
						// 嵌入模式:通知宿主;同时自己也尝试触发页面内选中(若有面板)
						try { window.parent.postMessage(payload, "*"); } catch (e) {}
					}
					// 页面内联动:若有 on_screen_det_trigger 则触发(独立页行为)
					var safe = pname.replace(/ /g, "_");
					var trig = document.getElementById("on_screen_det_trigger-" + safe);
					if (trig) trig.click();
				};
			})(persona_name));
		}

		// Create animations
		const anims = this.anims;
		for (let i = 0; i < Object.keys(persona_names).length; i++) {
			let persona_name = Object.keys(persona_names)[i];
			let left_walk_name = persona_name + "-left-walk";
			let right_walk_name = persona_name + "-right-walk";
			let down_walk_name = persona_name + "-down-walk";
			let up_walk_name = persona_name + "-up-walk";

			frameRate = 4;
			if (live_mode) frameRate = 10;             // live mode: walk animation matches movement speed
			else if (movement_speed > 1) frameRate = 8;

			anims.create({
				key: left_walk_name,
				frames: anims.generateFrameNames(persona_name, { prefix: "left-walk.", start: 0, end: 3, zeroPad: 3 }),
				frameRate: frameRate,
				repeat: -1
			});

			anims.create({
				key: right_walk_name,
				frames: anims.generateFrameNames(persona_name, { prefix: "right-walk.", start: 0, end: 3, zeroPad: 3 }),
				frameRate: frameRate,
				repeat: -1
			});

			anims.create({
				key: down_walk_name,
				frames: anims.generateFrameNames(persona_name, { prefix: "down-walk.", start: 0, end: 3, zeroPad: 3 }),
				frameRate: frameRate,
				repeat: -1
			});

			anims.create({
				key: up_walk_name,
				frames: anims.generateFrameNames(persona_name, { prefix: "up-walk.", start: 0, end: 3, zeroPad: 3 }),
				frameRate: frameRate,
				repeat: -1
			});
		}
	}

	// Update function
	function update(time, delta) {
		// Chat panel always visible (show/hide buttons removed)

		// Move camera
		const camera_speed = 400;
		player.body.setVelocity(0);
		if (cursors.left.isDown) {
			player.body.setVelocityX(-camera_speed);
		}
		if (cursors.right.isDown) {
			player.body.setVelocityX(camera_speed);
		}
		if (cursors.up.isDown) {
			player.body.setVelocityY(-camera_speed);
		}
		if (cursors.down.isDown) {
			player.body.setVelocityY(camera_speed);
		}

		// 点击角色后镜头跟随(仅独立页有 temp_focus;embed 模式无该元素)
		let _focusEl = document.getElementById("temp_focus");
		let curr_focused_persona = _focusEl ? _focusEl.textContent : "";
		if (curr_focused_persona != "") {
			player.body.x = personas[curr_focused_persona].body.x;
			player.body.y = personas[curr_focused_persona].body.y;
			if (_focusEl) _focusEl.innerHTML = "";
		}

		if (live_mode && (sim_finished || sim_error)) {
			return;
		}

		// ---- replay mode: advance frame by frame, set each agent's movement target ----
		if (!live_mode) {
			if (step in all_movement) {
				for (let i = 0; i < Object.keys(personas).length; i++) {
					let curr_persona_name = Object.keys(personas)[i];
					let data = all_movement[step][curr_persona_name.replace("_", " ")];
					if (data && data.movement) {
						movement_target[curr_persona_name] = [
							[data.movement[0] * tile_width, data.movement[1] * tile_width]
						];
					}
				}
			}

			curr_datetime = new Date(start_datetime.getTime());
			curr_year = curr_datetime.getFullYear().toString().padStart(4, "0");
			curr_month = (curr_datetime.getMonth() + 1).toString().padStart(2, "0");
			curr_day = curr_datetime.getDate().toString().padStart(2, "0");
			curr_hour = curr_datetime.getHours().toString().padStart(2, "0");
			curr_minute = curr_datetime.getMinutes().toString().padStart(2, "0");
			conversation_key = `${curr_year}${curr_month}${curr_day}-${curr_hour}:${curr_minute}`;
			conversation_key_text = all_movement["conversation"][conversation_key];
			if (conversation_key_text && conversation_key_text != "") {
				appendChat(conversation_key, conversation_key_text);
			}

			if (execute_count == 0) {
				execute_count = execute_count_max + 1;
				step = step + 1;
				start_datetime = new Date(start_datetime.getTime() + step_size);
				let rclock = document.getElementById("sim-clock-time");
				if (rclock) rclock.innerHTML = start_datetime.toLocaleTimeString("zh-CN");
			}
			execute_count -= 1;
		}

		// ---- unified movement: all agents with targets move smoothly along waypoints ----
		// speed is constant per delta time, avoiding too-fast sliding on high-refresh screens (120/144Hz)
		let step_px = 0.8 * (delta || 16.67) / 16.67;   // constant ~48px/s ≈ 1.5 tiles/s
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let curr_persona_name = Object.keys(personas)[i];
			let curr_persona = personas[curr_persona_name];
			let curr_pronunciatio = pronunciatios[curr_persona_name];
			let waypoints = movement_target[curr_persona_name];
			if (!waypoints || waypoints.length === 0) continue;

			let target = waypoints[0];
			let dx = target[0] - curr_persona.body.x;
			let dy = target[1] - curr_persona.body.y;
			let dist = Math.sqrt(dx * dx + dy * dy);

			// safety: when current position deviates too far from path start (lost messages/reconnect),
			// align to path start first, then walk point by point; never let the agent fly straight through walls
			if (dist > tile_width * 3) {
				curr_persona.body.x = target[0];
				curr_persona.body.y = target[1];
				curr_pronunciatio.x = target[0] - 15;
				curr_pronunciatio.y = target[1] - 15 - 25;
				continue;
			}

			if (dist <= step_px) {
				// arrived at current waypoint: snap to it, take the next
				curr_persona.body.x = target[0];
				curr_persona.body.y = target[1];
				waypoints.shift();
				if (waypoints.length === 0) {
					delete movement_target[curr_persona_name];
					// path finished: stop walking animation
					let d = pre_anims_direction_dict[curr_persona_name];
					if (d == "l") curr_persona.setTexture(curr_persona_name, "left");
					else if (d == "r") curr_persona.setTexture(curr_persona_name, "right");
					else if (d == "u") curr_persona.setTexture(curr_persona_name, "up");
					else if (d == "d") curr_persona.setTexture(curr_persona_name, "down");
					curr_persona.anims.stop();
				}
			} else {
				// move smoothly toward the current waypoint
				let vx = dx / dist * step_px;
				let vy = dy / dist * step_px;
				curr_persona.body.x += vx;
				curr_persona.body.y += vy;

				// walking animation (by movement direction)
				let dir = Math.abs(dx) > Math.abs(dy) ? (vx > 0 ? "r" : "l") : (vy > 0 ? "d" : "u");
				pre_anims_direction_dict[curr_persona_name] = dir;
				// animation key uses full words (down/up/left/right), consistent with the create phase
				let dir_word = dir == "d" ? "down" : dir == "u" ? "up" : dir == "l" ? "left" : "right";
				curr_persona.anims.play(curr_persona_name + "-" + dir_word + "-walk", true);
			}
		}

		// ---- text bubbles: reset to each agent's head (baseline) every frame, then detect overlaps ----
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let name = Object.keys(personas)[i];
			pronunciatios[name].x = personas[name].body.x - 15;
			pronunciatios[name].y = personas[name].body.y - 15 - 25;
		}

		// ---- text bubble overlap: adjacent agents' bubbles offset vertically to avoid occlusion ----
		// detect on the per-frame baseline; offset only when overlapping; bubbles return when agents separate
		let bubbles = [];
		for (let i = 0; i < Object.keys(personas).length; i++) {
			let name = Object.keys(personas)[i];
			let b = pronunciatios[name];
			if (!b.text) continue;
			bubbles.push({ name: name, x: b.x, y: b.y, w: b.width, h: b.height });
		}
		bubbles.sort((a, b) => a.y - b.y || a.x - b.x);
		for (let i = 1; i < bubbles.length; i++) {
			let prev = bubbles[i - 1];
			let cur = bubbles[i];
			if (cur.x < prev.x + prev.w && prev.x < cur.x + cur.w &&
				cur.y < prev.y + prev.h && prev.y < cur.y + cur.h) {
				pronunciatios[cur.name].y = prev.y + prev.h + 2;
				cur.y = pronunciatios[cur.name].y;
				cur.h = pronunciatios[cur.name].height;
			}
		}
	}

	// ================= Goals live adjustment =================
	// Load governance constraints (editable) + value tendency (read-only) from /api/goals
	var goalsData = {};    // agent -> {goalName: weight}  治理约束(可调)
	var tendencyData = {}; // agent -> {goalName: weight}  价值倾向(只读,内化结果)
	var interventionsData = []; // 专家干预审计(曲线竖线标记)
	var roleTypes = {};    // agent -> "ai_tool" / "user"
	var selectedAgent = "";      // 当前详情视图选中的角色
	var goalsTimer = null;
	var timelineTimer = null;    // 时间轴轮询定时器
	var timelineEvents = [];     // 时间轴事件缓存(干预 + 撤销)
	var tlColors = {};           // agent -> 颜色(时间轴圆点)

	function goalsEscape(s) {
		return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
	}

	// 角色选择栏 + 选中角色详情(大曲线 + 约束vs倾向信息)
	function goalsRender() {
		var body = document.getElementById("goals-body");
		if (!body) return;
		var agents = Object.keys(goalsData).sort();
		if (agents.length === 0) {
			body.innerHTML = '<div style="color:#999;">未配置角色。</div>';
			return;
		}
		if (!selectedAgent || goalsData[selectedAgent] === undefined) selectedAgent = agents[0];
		var html = "";
		// 角色选择栏
		html += '<div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px;">';
		for (var i = 0; i < agents.length; i++) {
			var sel = agents[i] === selectedAgent;
			html += '<button data-agent-tab="' + goalsEscape(agents[i]) + '" style="padding:2px 8px; font-size:11px; border-radius:10px; border:1px solid ' + (sel ? "#2d6cdf" : "#ddd") + '; background:' + (sel ? "#2d6cdf" : "#fff") + '; color:' + (sel ? "#fff" : "#555") + '; cursor:pointer;">' + goalsEscape(agents[i]) + '</button>';
		}
		html += '</div>';
		// 选中角色详情
		var a = selectedAgent;
		var goals = goalsData[a] || {};
		var tend = tendencyData[a] || {};
		var names = Object.keys(goals);
		html += '<div style="margin-bottom:8px; border:1px solid #e0e0e0; border-radius:6px; padding:6px 8px;">';
		// 角色类型徽标:AI 工具(制度内建)→ 起点=约束;人(体验形成)→ 起点=均匀
		var isAITool = roleTypes[a] === "ai_tool";
		html += '<div style="display:flex; align-items:center; gap:6px;">';
		html += '<div style="font-weight:bold; color:#333;">' + goalsEscape(a) + '</div>';
		html += '<span style="font-size:9px; padding:0 6px; border-radius:8px; ' + (isAITool ? 'background:#e8f0fe; color:#2d6cdf;' : 'background:#f0f0f0; color:#666;') + ';">' + (isAITool ? "AI 工具·制度内建" : "人·体验形成") + '</span>';
		html += '</div>';
		// 核心观测:价值倾向(内化)演变曲线(大图,支持横向滚动)
		// canvas 固定高度,宽度按数据点数动态撑开,外层容器横向滚动
		html += '<div style="margin:4px 0; overflow-x:auto; border:1px solid #e8e8e8; border-radius:4px; background:#fcfcfc;"><canvas data-tend-chart-for="' + goalsEscape(a) + '" width="356" height="150" style="height:150px; display:block;"></canvas></div>';
		// 曲线图例
		html += '<div style="font-size:10px; color:#666; margin:0 0 4px; line-height:1.5;" data-tend-legend-for="' + goalsEscape(a) + '"></div>';
		// 导出按钮 + 解释面板按钮
		html += '<div style="text-align:right; margin:0 0 4px;"><button data-export-chart-for="' + goalsEscape(a) + '" style="padding:2px 10px; font-size:10px; border:1px solid #ccc; border-radius:4px; background:#fafafa; color:#555; cursor:pointer;">导出图片</button> <button data-explain-for="' + goalsEscape(a) + '" style="padding:2px 10px; font-size:10px; border:1px solid #2d6cdf; border-radius:4px; background:#eef3ff; color:#2d6cdf; cursor:pointer;">解释倾向成因</button></div>';
		// 倾向成因解释面板(可解释性:构成分解 + 窗口明细 + 干预因果链)
		html += '<div data-explain-panel-for="' + goalsEscape(a) + '" style="display:none; margin:4px 0; border:1px solid #dbe4f5; border-radius:6px; background:#f7f9ff; padding:6px 8px; font-size:10px;"></div>';
		// 信息区:约束(制度期望) vs 倾向(内化现状) 对照
		html += '<div style="font-size:10px; margin:4px 0; border-top:1px dashed #e0e0e0; padding-top:4px;">';
		html += '<div style="color:#888; margin-bottom:2px;">约束(期望) vs 倾向(内化)对照:</div>';
		for (var ci = 0; ci < names.length; ci++) {
			var g = names[ci];
			var w = goals[g] || 0;
			var tv = tend[g] !== undefined ? tend[g] : null;
			var color = TEND_COLORS[ci % TEND_COLORS.length];
			var wbar = Math.round(w * 100);
			var tvbar = tv !== null ? Math.round(tv * 100) : 0;
			var delta = tv !== null ? (tv - w) : 0;
			html += '<div style="display:flex; align-items:center; gap:6px; margin:2px 0;">';
			html += '<span style="flex:0 0 130px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#555;" title="' + goalsEscape(g) + '"><span style="color:' + color + ';">■</span> ' + goalsEscape(g) + '</span>';
			// 约束条(灰) + 倾向条(彩色) 并排
