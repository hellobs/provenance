# pytest 配置(2026-09-27:让新人"从仓库根"也能跑测试)
#
# 为什么需要:pytest 默认只把"测试文件所在目录/rootdir"放进 sys.path。
# 本仓的 case_engine / case01 / live 都在 `provenance/` 包目录下,测试里写的是
# `from case_engine... import ...` —— 不写下面的 pythonpath 时,只有先 `cd provenance`
# 才能 import 成功;从仓库根跑会直接 `ModuleNotFoundError: No module named 'case_engine'`
# (新人几乎必踩,实测)。这里显式声明,从哪个目录跑都成立。
#
# 注:packages/ 下的两个独立包各有自己的 pyproject,[tool.pytest.ini_options] 优先,
# 不受本文件影响。
[pytest]
pythonpath =
    provenance
    packages/mavis-case01-injector/src
    packages/mavis-vizkit/src
