name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mavisframework (engine) from source
        run: |
          git clone --depth 1 https://github.com/hellobs/mavis.git ../mavis
          pip install ../mavis

      - name: Install mavis-vizkit (editable, packages/mavis-vizkit)
        run: |
          pip install -e packages/mavis-vizkit

      - name: Install injector package (editable, phase 3)
        # 阶段 3 抽包:case01/injector 的实现移至 packages/mavis-case01-injector,
        # provenance 侧经 shim 兼容;测试与运行期 import 的是这个已安装包。
        run: |
          pip install -e packages/mavis-case01-injector

      - name: Install dependencies (single source, provenance/requirements.txt) + pytest
        # 单一来源:从 provenance/requirements.txt 装全部运行依赖,避免手维护的裸清单
        # 与 requirements 漂移(曾致 OpenAPI 守卫测试缺 pyyaml 在 CI 必红)。
        # mavisframework/mavis-vizkit 已在上面两步分别以源码/editable 装好,此时 pip
        # 认为 "already satisfied",不会去 PyPI 拉取这两个本地包。
        run: |
          pip install -r provenance/requirements.txt pytest

      - name: Assert engine baseline exposes plugin surface
        # 决策材料 §3 要求的前置断言:依赖装好后、任何测试之前先验"基线上确实有插件面"。
        # 若容器错装到 <=1.1.0 的旧制品,这里先红,而不是让 case01 的特性探测静默回退、
        # 测试"照样通过"。脚本同时打印 mavisframework.__file__,便于排查"从工作树源码装的"。
        run: |
          python tools/check_engine_baseline.py

      - name: Backend API + page render tests
        run: |
          python -m pytest tests -v

      - name: case_engine suite (engine's own tests)
        # 引擎本体(case_engine)的测试此前**从未在 CI 跑过** —— 正在被反复重构的那一层
        # 零覆盖,回归只能靠人跑。这里补上,与 case01 同源安装(case_engine 在 provenance/ 下)。
        run: |
          cd provenance
          python -m pytest case_engine/tests -q

      - name: Frontend JS smoke test (node, reads pytest-rendered HTML)
        run: |
          node tests/frontend_smoke.js tests/_pages

      - name: mavis-vizkit suite (package's own tests)
        # 补盲区:此前 CI 只跑外层与 case01 两套,mavis-vizkit 自己的 25 个测试从未在 CI 上跑过,
        # vizkit 内部回归(如事件契约键名漂移)只能靠 case01 间接照到一部分。包内 pyproject
        # 自带 testpaths/addopts,故 cd 进包目录直接跑。
        run: |
          cd packages/mavis-vizkit
          python -m pytest

      - name: Case01 + vizkit suite (requires mavis-vizkit installed above)
        run: |
          cd provenance
          python -m pytest case01/tests -q
