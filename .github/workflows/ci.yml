name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mavisframework (engine) from source
        run: |
          git clone --depth 1 https://github.com/hellobs/mavis.git ../mavis
          pip install ../mavis

      - name: Install test dependencies
        run: |
          pip install pytest fastapi uvicorn websockets jinja2 httpx

      - name: Backend API + page render tests
        run: |
          python -m pytest tests -v

      - name: Frontend JS smoke test (node, reads pytest-rendered HTML)
        run: |
          node tests/frontend_smoke.js tests/_pages
